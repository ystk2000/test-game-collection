<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TITAN BALL 2.8</title>
    <style>
        /* CSS Definitions */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000000; font-family: 'Segoe UI', sans-serif; touch-action: none; }
        #game-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
        .floating-hp { position: absolute; width: 60px; height: 8px; background: rgba(0,0,0,0.6); border: 1px solid #888; border-radius: 4px; transform: translate(-50%, -50%); display: none; z-index: 5; }
        .floating-hp-fill { height: 100%; width: 100%; border-radius: 3px; transition: width 0.1s linear; }
        .hp-p { background: #00ff00; } .hp-e { background: #ff3333; } .hp-down { background: #ffff00; }
        .status-label { position: absolute; color: yellow; font-weight: bold; font-size: 12px; text-shadow: 1px 1px 0 #000; transform: translate(-50%, -50%); display: none; white-space: nowrap; }
        #top-ui { position: absolute; width: 100%; top: 0; padding: 0 20px; pointer-events: auto; z-index: 20; display: flex; justify-content: space-between; align-items: center; }
        .left-ui-group { display: flex; align-items: center; }
        .ui-box { display: flex; flex-direction: column; align-items: center; margin-right: 15px; color: white; text-shadow: 2px 2px 0 #000; }
        .ui-label { font-size: 10px; color: #aaa; } .ui-value { font-size: 24px; font-weight: bold; color: #ffd700; } #timer-val { color: #fff; }
        .icon-btn { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.4); color: white; width: 36px; height: 36px; border-radius: 50%; font-size: 18px; font-weight: bold; display: flex; justify-content: center; align-items: center; cursor: pointer; pointer-events: auto; margin-right: 8px; backdrop-filter: blur(4px); }
        .icon-btn:active { background: rgba(255,255,255,0.4); }
        #countdown-overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 120px; font-weight: 900; color: rgba(255,255,255,0.8); text-shadow: 0 0 20px rgba(255,0,0,0.8); pointer-events: none; display: none; z-index: 15; font-family: 'Arial Black', sans-serif; }
        .anim-pop { animation: pop 0.9s cubic-bezier(0.1, 0.7, 1.0, 0.1) forwards; }
        @keyframes pop { 0% { transform: translate(-50%,-50%) scale(0.5); opacity: 0; } 50% { transform: translate(-50%,-50%) scale(1.2); opacity: 1; } 100% { transform: translate(-50%,-50%) scale(1.5); opacity: 0; } }
        .screen { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(10,10,15,0.95); padding: 30px; border-radius: 16px; text-align: center; color: white; border: 1px solid #444; pointer-events: auto; width: 85%; max-width: 450px; box-shadow: 0 20px 60px rgba(0,0,0,0.9); z-index: 30; max-height: 80vh; overflow-y: auto; }
        .hidden { display: none !important; }
        .modal { display: none; z-index: 100; text-align: left; }
        .modal-title { color: #ffd700; font-size: 20px; margin-bottom: 15px; border-bottom: 1px solid #555; padding-bottom: 10px; text-align: center; }
        .score-rule { margin-bottom: 10px; font-size: 13px; line-height: 1.4; color: #ddd; border-bottom: 1px solid #333; padding-bottom: 5px; }
        .score-val { color: #00ff00; font-weight: bold; float: right; }
        h1 { color: #d2691e; margin: 0 0 15px 0; font-size: 28px; text-transform: uppercase; letter-spacing: 2px; }
        button.game-btn { background: linear-gradient(to bottom, #d2691e, #8b4513); border: 1px solid #ffd700; color: white; padding: 12px 0; font-size: 18px; font-weight: bold; border-radius: 8px; margin-top: 20px; width: 100%; }
        #touch-zone { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5; }
        .joystick-base { position: absolute; width: 120px; height: 120px; border-radius: 50%; background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.3); pointer-events: none; display: none; transform: translate(-50%, -50%); }
        .joystick-knob { position: absolute; width: 60px; height: 60px; border-radius: 50%; background: rgba(255,255,255,0.5); top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
</head>
<body>

    <div id="game-container"></div>
    <div id="touch-zone"><div id="joy-base" class="joystick-base"><div id="joy-knob" class="joystick-knob"></div></div></div>

    <div id="ui-layer">
        <div id="top-ui">
            <div class="left-ui-group">
                <div class="ui-box">
                    <div class="ui-label">スコア</div>
                    <div id="score-display" class="ui-value">0</div>
                </div>
                <div class="ui-box">
                    <div class="ui-label">タイム</div>
                    <div id="timer-val" class="ui-value">180</div>
                </div>
                <div id="info-btn" class="icon-btn" style="margin-left: 10px;">ℹ️</div>
                <div id="help-btn" class="icon-btn">?</div>
            </div>
        </div>

        <div id="hp-bars-container"></div>
        <div id="countdown-overlay">10</div>

        <!-- Start Screen (No Description) -->
        <div id="start-screen" class="screen">
            <h1>TITAN BALL</h1>
            <button class="game-btn" id="start-btn">バトル開始</button>
        </div>

        <!-- Game Over (Japanese) -->
        <div id="game-over-screen" class="screen hidden">
            <h1 style="color:#fff;">タイムアップ！</h1>
            <p id="final-score" style="font-size:32px; color:#ffd700;">スコア: 0</p>
            <button class="game-btn" id="restart-btn">リトライ</button>
        </div>

        <!-- Info Modal -->
        <div id="info-modal" class="screen modal">
            <div class="modal-title">Ver 2.8 更新情報</div>
            <div class="score-rule">⏳ <strong>ゲーム時間変更</strong><br>制限時間を180秒に変更しました。</div>
            <div class="score-rule">🎬 <strong>ヒットストップ調整</strong><br>カメラが吹っ飛ぶ敵をより正確に追従します。</div>
            <div class="score-rule">🏆 <strong>スコア調整</strong><br>赤鉄球ヒット: 50ptに変更。</div>
            <button class="game-btn" id="close-info-btn" style="margin-top:15px; background: #444; border-color:#888;">閉じる</button>
        </div>

        <!-- Help Modal -->
        <div id="help-modal" class="screen modal">
            <div class="modal-title">スコアシステム</div>
            <div class="score-rule">
                <div>💥 <strong>ヒットボーナス</strong></div>
                <div style="font-size:12px; color:#aaa;">通常ヒット: +10pt<br>赤鉄球ヒット: +50pt</div>
            </div>
            <div class="score-rule">
                <div>💀 <strong>撃破ボーナス</strong></div>
                <div class="score-val">+100pt</div>
                <div style="font-size:12px; color:#aaa;">敵のHPを0にすると追加加算</div>
            </div>
            <button class="game-btn" id="close-help-btn" style="margin-top:15px; background: #444; border-color:#888;">閉じる</button>
        </div>
    </div>

    <script>
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.body.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

        function createGridTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#111111'; ctx.fillRect(0, 0, 512, 512);
            ctx.strokeStyle = '#666666'; ctx.lineWidth = 10;
            for(let i=0; i<=512; i+=64) {
                ctx.moveTo(i, 0); ctx.lineTo(i, 512);
                ctx.moveTo(0, i); ctx.lineTo(512, i);
            }
            ctx.stroke();
            return new THREE.CanvasTexture(canvas);
        }

        const ASSETS = {
            bg: 'https://gdp-nlp-chat.cdn.sfmji.com/synclub-nlp-chat/gemini_image_generate_96c118c2-2019-45eb-8692-1e9a38014bef_2026-01-26-02:33:09_956dbee7-7939-4afe-94a7-6eb7969e65be_2.png'
        };

        const PHYSICS = {
            moveSpeed: 0.8, 
            friction: 0.90,
            ballFriction: 0.998,
            chainLength: 105,
            ballMass: 15,
            playerMass: 6,
            ballRadius: 14.0,
            arenaSize: 260,
            heatThreshold: 3.5
        };

        const GAME_DURATION = 180; // Changed to 180s

        let scene, camera, renderer, clock;
        let textureLoader, gridTexture;
        let gameActive = false;
        let characters = [];
        let score = 0;
        let timeLeft = GAME_DURATION;
        let timerInterval;
        let particleSystem;

        // Cinematic Variables
        let timeScale = 1.0;
        let cameraLookAtPos = new THREE.Vector3();
        let baseCamOffset = new THREE.Vector3(0, 400, 300);

        const cinematic = {
            active: false,
            tween: null,
            target: null,
            startPos: new THREE.Vector3(),
            startLook: new THREE.Vector3(),
            
            start(target) {
                if (this.tween) this.tween.stop();
                this.active = true;
                this.target = target;
                
                this.startPos.copy(camera.position);
                this.startLook.copy(cameraLookAtPos);
                
                timeScale = 0.0; // Pause
                
                // Phase 1: Zoom In
                this.tween = new TWEEN.Tween({ t: 0 })
                    .to({ t: 1 }, 500)
                    .easing(TWEEN.Easing.Quadratic.Out)
                    .onUpdate(o => {
                        updateCameraCinematic(o.t);
                    })
                    .onComplete(() => {
                        timeScale = 0.25; // Resume Slow
                        // Phase 2: Stay & Track
                        this.tween = new TWEEN.Tween({ t: 1 })
                            .to({ t: 1 }, 500)
                            .onUpdate(o => {
                                updateCameraCinematic(1.0); // Keep at close view relative to moving target
                            })
                            .onComplete(() => {
                                // Phase 3: Return
                                // Recapture current as start to prevent jump if target moved
                                this.startPos.copy(camera.position);
                                this.startLook.copy(cameraLookAtPos);
                                
                                this.tween = new TWEEN.Tween({ t: 1 })
                                    .to({ t: 0 }, 1000)
                                    .easing(TWEEN.Easing.Quadratic.Out)
                                    .onUpdate(o => {
                                        updateCameraCinematicReturn(o.t);
                                    })
                                    .onComplete(() => {
                                        this.active = false;
                                        timeScale = 1.0;
                                    })
                                    .start();
                            })
                            .start();
                    })
                    .start();
            }
        };

        function updateCameraCinematic(ratio) {
            // Target: Player Game View
            const pPos = characters[0].pos;
            const gamePos = pPos.clone().add(baseCamOffset);
            
            // Target: Victim Close View (Dynamic)
            const vPos = cinematic.target.pos;
            const closePos = vPos.clone().add(new THREE.Vector3(0, 30, 45)); // Closer view
            
            // Interpolate
            camera.position.lerpVectors(gamePos, closePos, ratio);
            
            // Look At Interpolation
            // Game looks at Player(floor). Close looks at Victim Chest(y+12).
            const lookGame = pPos; 
            const lookClose = vPos.clone().add(new THREE.Vector3(0, 12, 0));
            
            cameraLookAtPos.lerpVectors(lookGame, lookClose, ratio);
            camera.lookAt(cameraLookAtPos);
        }

        function updateCameraCinematicReturn(ratio) {
            // Specialized for return phase to use captured start position
            // Ratio goes 1 -> 0
            
            // End: Player Game View (Dynamic)
            const pPos = characters[0].pos;
            const gamePos = pPos.clone().add(baseCamOffset);
            const lookGame = pPos;

            // Start: Captured at end of Phase 2
            // We lerp from startPos to gamePos using (1-ratio) if ratio went 0->1
            // Here ratio is going 1->0 directly from tween?
            // Actually tween goes 1 -> 0.
            // So we use ratio directly as factor?
            // lerp(end, start, t). If t=1 (start of tween), we want start. If t=0, we want end.
            // lerpVectors(B, A, t) = B + (A-B)*t.
            // If t=1 -> A. If t=0 -> B.
            // A = this.startPos. B = gamePos.
            
            camera.position.lerpVectors(gamePos, cinematic.startPos, ratio);
            cameraLookAtPos.lerpVectors(lookGame, cinematic.startLook, ratio);
            camera.lookAt(cameraLookAtPos);
        }

        const screenHeight = window.innerHeight;
        const topExclusionHeight = screenHeight >= 812 ? 98 : 74;
        document.getElementById('top-ui').style.marginTop = topExclusionHeight + 'px';

        const keys = {};
        const joystick = { x: 0, y: 0, active: false };

        class SparkSystem {
            constructor(scene) {
                this.particles = [];
                this.poolSize = 80;
                this.geo = new THREE.BoxGeometry(1.2, 1.2, 6); 
                this.mat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
                for(let i=0; i<this.poolSize; i++) {
                    const mesh = new THREE.Mesh(this.geo, this.mat);
                    mesh.visible = false; scene.add(mesh);
                    this.particles.push({ mesh: mesh, active: false, vel: new THREE.Vector3(), life: 0 });
                }
            }
            spawn(pos, count) {
                let spawned = 0;
                for(let p of this.particles) {
                    if(!p.active) {
                        p.active = true; p.life = 0.8; 
                        p.mesh.visible = true;
                        p.mesh.position.copy(pos);
                        const rDir = new THREE.Vector3(Math.random()-0.5, Math.random()+0.5, Math.random()-0.5).normalize();
                        p.vel.copy(rDir).multiplyScalar(1.5 + Math.random());
                        spawned++; if(spawned >= count) break;
                    }
                }
            }
            update(dtScale) {
                if (dtScale <= 0) return;
                for(let p of this.particles) {
                    if(p.active) {
                        p.vel.y -= 0.08 * dtScale; 
                        p.mesh.position.add(p.vel.clone().multiplyScalar(dtScale));
                        p.life -= 0.016 * dtScale; 
                        if (p.vel.lengthSq() > 0.01) {
                            p.mesh.lookAt(p.mesh.position.clone().add(p.vel));
                            p.mesh.scale.z = 1 + p.vel.length() * 2; 
                        }
                        if(p.mesh.position.y < 0) p.life = 0;
                        if(p.life <= 0) { p.active = false; p.mesh.visible = false; }
                    }
                }
            }
        }

        class Gladiator {
            constructor(id, x, z, isPlayer) {
                this.id = id; this.isPlayer = isPlayer;
                this.maxHp = 100; this.hp = 100; this.isDown = false;
                this.pos = new THREE.Vector3(x, 0, z); this.vel = new THREE.Vector3(0, 0, 0);
                this.angle = 0; this.walkCycle = 0; this.heatFactor = 0;
                this.flashTime = 0; this.reviveDelay = 0; this.invincibleTime = 0;
                this.isDying = false; this.dieKnockbackTimer = 0;

                this.mesh = new THREE.Group();
                const armorColor = isPlayer ? 0x3366cc : 0xcc3333;
                this.parts = []; 
                
                this.torso = new THREE.Mesh(new THREE.BoxGeometry(10, 12, 6), new THREE.MeshLambertMaterial({ color: armorColor }));
                this.torso.position.y = 12; this.mesh.add(this.torso); this.parts.push(this.torso);

                this.headGroup = new THREE.Group(); this.headGroup.position.y = 22; this.mesh.add(this.headGroup);
                const headMat = new THREE.MeshLambertMaterial({ color: 0x888888 });
                this.head = new THREE.Mesh(new THREE.BoxGeometry(8, 8, 8), headMat);
                this.headGroup.add(this.head); this.parts.push(this.head);
                
                const eyeMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
                const el = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 1), eyeMat); el.position.set(-2, 0, 4.1); this.headGroup.add(el);
                const er = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 1), eyeMat); er.position.set(2, 0, 4.1); this.headGroup.add(er);
                const hGeo = new THREE.BoxGeometry(2, 6, 2);
                const hl = new THREE.Mesh(hGeo, headMat); hl.position.set(-4.5, 4, 0); this.headGroup.add(hl); this.parts.push(hl);
                const hr = new THREE.Mesh(hGeo, headMat); hr.position.set(4.5, 4, 0); this.headGroup.add(hr); this.parts.push(hr);

                const armMat = new THREE.MeshLambertMaterial({ color: isPlayer?0xffccaa:0xaa8866 });
                const armGeo = new THREE.BoxGeometry(3, 10, 3);
                this.armL = new THREE.Mesh(armGeo, armMat); this.armL.position.set(-5, 14, 4); this.armL.rotation.set(-Math.PI/2+0.2, 0, 0.2); this.mesh.add(this.armL); this.parts.push(this.armL);
                this.armR = new THREE.Mesh(armGeo, armMat); this.armR.position.set(5, 14, 4); this.armR.rotation.set(-Math.PI/2+0.2, 0, -0.2); this.mesh.add(this.armR); this.parts.push(this.armR);
                
                const legMat = new THREE.MeshLambertMaterial({ color: 0x444444 });
                const legGeo = new THREE.BoxGeometry(3.5, 10, 4);
                this.legL = new THREE.Mesh(legGeo, legMat); this.legL.position.set(-3, 5, 0); this.mesh.add(this.legL); this.parts.push(this.legL);
                this.legR = new THREE.Mesh(legGeo, legMat); this.legR.position.set(3, 5, 0); this.mesh.add(this.legR); this.parts.push(this.legR);

                this.mesh.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}});
                scene.add(this.mesh);

                this.ballPos = new THREE.Vector3(x + 50, 0, z);
                this.ballVel = new THREE.Vector3(0, 0, 0);
                this.ballMat = new THREE.MeshStandardMaterial({
                    map: gridTexture, roughness: 0.2, metalness: 0.8,
                    color: 0xffffff, emissive: 0x000000
                });
                this.ballMesh = new THREE.Mesh(new THREE.SphereGeometry(PHYSICS.ballRadius, 32, 32), this.ballMat);
                this.ballMesh.castShadow = true; this.ballMesh.receiveShadow = true;
                scene.add(this.ballMesh);

                this.chainLinks = [];
                this.chainMat = new THREE.MeshStandardMaterial({ color: 0x333333, emissive: 0x000000 });
                for(let i=0; i<5; i++) {
                    const l = new THREE.Mesh(new THREE.SphereGeometry(1.5, 8, 8), this.chainMat);
                    l.castShadow = true; scene.add(l); this.chainLinks.push(l);
                }

                this.createUI();
            }

            createUI() {
                this.hpBarId = `hp-bar-${this.id}`; this.hpFillId = `hp-fill-${this.id}`;
                this.statusId = `status-${this.id}`;

                const container = document.createElement('div'); container.id = this.hpBarId; container.className = 'floating-hp';
                const fill = document.createElement('div'); fill.id = this.hpFillId; fill.className = 'floating-hp-fill ' + (this.isPlayer?'hp-p':'hp-e');
                const status = document.createElement('div'); status.id = this.statusId; status.className = 'status-label'; status.innerText = "ダウン中...";

                container.appendChild(fill);
                const root = document.getElementById('hp-bars-container');
                root.appendChild(container); root.appendChild(status);
            }

            update(dx, dz, dtScale) {
                if (this.flashTime > 0) {
                    this.flashTime -= 0.05 * dtScale; 
                    const hex = 0xffffff;
                    this.parts.forEach(p => p.material.emissive.setHex(hex));
                } else {
                    this.parts.forEach(p => p.material.emissive.setHex(0x000000));
                }
                
                if (this.invincibleTime > 0) {
                    this.invincibleTime -= 0.016 * dtScale;
                    this.mesh.visible = Math.floor(this.invincibleTime * 20) % 2 === 0;
                } else {
                    this.mesh.visible = true;
                }

                if (this.isDown) {
                    this.vel.multiplyScalar(0.85); 
                    if (this.reviveDelay > 0) {
                        this.reviveDelay -= 0.016 * dtScale;
                    } else {
                        this.recover(dtScale);
                    }
                } else if (this.isDying) {
                    this.dieKnockbackTimer -= 0.016 * dtScale;
                    this.vel.multiplyScalar(0.95);
                    this.mesh.rotation.x = -Math.PI/4 * (1.0 - (this.dieKnockbackTimer / 0.5)); 
                    if (this.dieKnockbackTimer <= 0) this.finalizeDown();
                } else {
                    this.vel.x += dx * PHYSICS.moveSpeed * 0.2 * dtScale;
                    this.vel.z += dz * PHYSICS.moveSpeed * 0.2 * dtScale;
                    this.vel.multiplyScalar(PHYSICS.friction);
                    
                    let nearest = null, minD = Infinity;
                    characters.forEach(other => {
                        if (other !== this && !other.isDown && !other.isDying) {
                            const d = this.pos.distanceTo(other.pos);
                            if (d < minD) { minD = d; nearest = other; }
                        }
                    });
                    if (nearest) {
                        let diff = Math.atan2(nearest.pos.x - this.pos.x, nearest.pos.z - this.pos.z) - this.angle;
                        while (diff > Math.PI) diff -= Math.PI * 2; while (diff < -Math.PI) diff += Math.PI * 2;
                        if (diff > 1.4) diff = 1.4; if (diff < -1.4) diff = -1.4;
                        this.headGroup.rotation.y = THREE.MathUtils.lerp(this.headGroup.rotation.y, diff, 0.1 * dtScale);
                    } else {
                        this.headGroup.rotation.y = THREE.MathUtils.lerp(this.headGroup.rotation.y, 0, 0.1 * dtScale);
                    }

                    const lookDir = new THREE.Vector3().subVectors(this.ballPos, this.pos);
                    this.angle = Math.atan2(lookDir.x, lookDir.z);
                }

                this.ballVel.multiplyScalar(PHYSICS.ballFriction);
                this.pos.add(this.vel.clone().multiplyScalar(dtScale));
                this.ballPos.add(this.ballVel.clone().multiplyScalar(dtScale));
                this.applyPhysicsStep();

                const speed = Math.sqrt(this.vel.x**2 + this.vel.z**2);
                if (speed > 0.1 && !this.isDown && !this.isDying) {
                    this.walkCycle += speed * 0.8 * dtScale;
                    this.legL.rotation.x = Math.sin(this.walkCycle) * 0.5; this.legR.rotation.x = -Math.sin(this.walkCycle) * 0.5;
                } else { this.legL.rotation.x = 0; this.legR.rotation.x = 0; }

                const diffV = new THREE.Vector3().subVectors(this.ballPos, this.pos);
                const dist = diffV.length();
                if (dist > PHYSICS.chainLength) {
                    const correction = diffV.normalize().multiplyScalar(dist - PHYSICS.chainLength).multiplyScalar(0.1);
                    this.ballVel.sub(correction.clone().divideScalar(PHYSICS.ballMass));
                    if (dist > PHYSICS.chainLength * 1.2) {
                        this.ballPos.copy(this.pos).add(diffV.normalize().multiplyScalar(PHYSICS.chainLength * 1.2));
                    }
                }

                const ballSpeed = this.ballVel.length();
                const fadeSpeed = 0.083 * dtScale;
                if (ballSpeed > PHYSICS.heatThreshold) this.heatFactor = Math.min(1, this.heatFactor + fadeSpeed);
                else this.heatFactor = Math.max(0, this.heatFactor - fadeSpeed);

                const glow = new THREE.Color(0x000000).lerp(new THREE.Color(0xff0000), this.heatFactor * 0.7);
                this.ballMat.emissive = glow;
                this.chainMat.emissive = glow;

                this.syncVisuals();
            }

            applyPhysicsStep() {
                const limit = PHYSICS.arenaSize - 5;
                if (this.pos.x < -limit) { this.pos.x = -limit; this.vel.x = 0; }
                if (this.pos.x > limit) { this.pos.x = limit; this.vel.x = 0; }
                if (this.pos.z < -limit) { this.pos.z = -limit; this.vel.z = 0; }
                if (this.pos.z > limit) { this.pos.z = limit; this.vel.z = 0; }

                const bLimit = PHYSICS.arenaSize - PHYSICS.ballRadius;
                if (Math.abs(this.ballPos.x) > bLimit) {
                    this.ballPos.x = Math.sign(this.ballPos.x)*bLimit; this.ballVel.x *= -0.8;
                    particleSystem.spawn(this.ballPos, 10);
                }
                if (Math.abs(this.ballPos.z) > bLimit) {
                    this.ballPos.z = Math.sign(this.ballPos.z)*bLimit; this.ballVel.z *= -0.8;
                    particleSystem.spawn(this.ballPos, 10);
                }
            }

            syncVisuals() {
                this.mesh.position.copy(this.pos);
                this.mesh.rotation.y = this.angle;
                
                this.ballMesh.position.copy(this.ballPos);
                this.ballMesh.position.y = PHYSICS.ballRadius;
                this.ballMesh.rotation.x += this.ballVel.z * 0.05;
                this.ballMesh.rotation.z -= this.ballVel.x * 0.05;

                const handOffset = new THREE.Vector3(0, 14, 8); 
                handOffset.applyAxisAngle(new THREE.Vector3(0, 1, 0), this.angle);
                const start = this.pos.clone().add(handOffset);
                const end = new THREE.Vector3(this.ballPos.x, PHYSICS.ballRadius, this.ballPos.z);
                const dist = start.distanceTo(end);

                for(let i=0; i<this.chainLinks.length; i++) {
                    const t = (i + 1) / (this.chainLinks.length + 1);
                    const p = new THREE.Vector3().lerpVectors(start, end, t);
                    const sag = Math.max(0, (PHYSICS.chainLength - dist) * 0.15);
                    p.y -= sag * 4 * (t - 0.5) * (t - 0.5) + sag; if (p.y < 2) p.y = 2;
                    this.chainLinks[i].position.copy(p);
                }
            }

            takeDamage(amount, impactVel) {
                if (this.isDown || this.isDying || this.invincibleTime > 0) return false;
                
                this.flashTime = 0.3; 
                this.hp -= amount;
                
                if (this.hp <= 0) {
                    this.triggerDie(impactVel);
                    return true;
                }
                return false;
            }

            triggerDie(impactVel) {
                this.isDying = true;
                this.hp = 0;
                this.dieKnockbackTimer = 0.5; 
                const finalKB = impactVel.clone().normalize().multiplyScalar(15); 
                this.vel.add(finalKB);
            }

            finalizeDown() {
                this.isDying = false;
                this.isDown = true;
                this.reviveDelay = 0.5;
                this.mesh.rotation.x = -Math.PI / 2;
                this.mesh.position.y -= 5;
                document.getElementById(this.statusId).style.display = 'block';
                document.getElementById(this.hpFillId).classList.add('hp-down');
            }

            recover(dtScale) {
                this.hp += 0.25 * dtScale;
                if (this.hp >= this.maxHp) this.revive();
            }

            revive() {
                this.isDown = false;
                this.invincibleTime = 1.0; 
                this.hp = this.maxHp;
                this.mesh.rotation.x = 0;
                this.mesh.position.y += 5;
                document.getElementById(this.statusId).style.display = 'none';
                document.getElementById(this.hpFillId).classList.remove('hp-down');
            }

            destroy() {
                scene.remove(this.mesh); scene.remove(this.ballMesh);
                this.chainLinks.forEach(l => scene.remove(l));
                document.getElementById(this.hpBarId)?.remove();
                document.getElementById(this.statusId)?.remove();
            }
        }

        function init() {
            scene = new THREE.Scene();
            scene.fog = new THREE.Fog(0x000000, 300, 900);
            clock = new THREE.Clock();
            camera = new THREE.PerspectiveCamera(40, window.innerWidth/window.innerHeight, 1, 2000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.getElementById('game-container').appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0x555555));
            const dl = new THREE.DirectionalLight(0xffffff, 0.9);
            dl.position.set(100, 400, 100); dl.castShadow = true;
            dl.shadow.mapSize.set(2048, 2048);
            dl.shadow.camera.left = -400; dl.shadow.camera.right = 400;
            dl.shadow.camera.top = 400; dl.shadow.camera.bottom = -400;
            scene.add(dl);

            textureLoader = new THREE.TextureLoader();
            gridTexture = createGridTexture();

            const floorTex = textureLoader.load(ASSETS.bg);
            floorTex.magFilter = THREE.NearestFilter; floorTex.minFilter = THREE.NearestFilter;
            floorTex.wrapS = THREE.RepeatWrapping; floorTex.wrapT = THREE.RepeatWrapping;
            floorTex.repeat.set(1, 1);
            
            const floor = new THREE.Mesh(new THREE.PlaneGeometry(PHYSICS.arenaSize*2, PHYSICS.arenaSize*2), new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.9 }));
            floor.rotation.x = -Math.PI/2; floor.receiveShadow = true; scene.add(floor);

            createWalls();
            particleSystem = new SparkSystem(scene);
            setupUIAndInputs();
            animate();
        }

        function createWalls() {
            const h = 20; const t = 20; const s = PHYSICS.arenaSize * 2 + t;
            const mat = new THREE.MeshStandardMaterial({ color: 0x443322, map: textureLoader.load(ASSETS.bg) });
            const walls = [
                {x:0, z: -PHYSICS.arenaSize - t/2, w:s, d:t}, {x:0, z: PHYSICS.arenaSize + t/2, w:s, d:t},
                {x: -PHYSICS.arenaSize - t/2, z:0, w:t, d:s}, {x: PHYSICS.arenaSize + t/2, z:0, w:t, d:s}
            ];
            walls.forEach(p => {
                const w = new THREE.Mesh(new THREE.BoxGeometry(p.w, h, p.d), mat);
                w.position.set(p.x, h/2, p.z); w.castShadow = true; w.receiveShadow = true; scene.add(w);
            });
        }

        function startGame() {
            characters.forEach(c => c.destroy()); characters = [];
            document.getElementById('hp-bars-container').innerHTML = '';
            characters.push(new Gladiator(0, -100, -100, true));
            characters.push(new Gladiator(1, 100, -100, false));
            characters.push(new Gladiator(2, -100, 100, false));
            characters.push(new Gladiator(3, 100, 100, false));
            score = 0; timeLeft = GAME_DURATION; gameActive = true; timeScale = 1.0;
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('countdown-overlay').style.display = 'none';
            if(cinematic.tween) cinematic.tween.stop();
            cinematic.active = false;
            
            if(timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if(!gameActive || cinematic.active) return;
                timeLeft--;
                document.getElementById('timer-val').innerText = timeLeft;
                
                if(timeLeft <= 10 && timeLeft > 0) {
                    const cd = document.getElementById('countdown-overlay');
                    cd.innerText = timeLeft;
                    cd.style.display = 'block';
                    cd.classList.remove('anim-pop');
                    void cd.offsetWidth; cd.classList.add('anim-pop');
                } else if (timeLeft > 10) {
                    document.getElementById('countdown-overlay').style.display = 'none';
                }

                if(timeLeft <= 0) gameOver();
            }, 1000);
        }

        function gameOver() {
            gameActive = false; timeScale = 1.0;
            clearInterval(timerInterval);
            document.getElementById('countdown-overlay').style.display = 'none';
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('final-score').innerText = 'スコア: ' + Math.floor(score);
            window.parent.postMessage({ type: 'gameOver', score: Math.floor(score) }, '*');
        }

        function updateUI() {
            if (!gameActive) return;
            document.getElementById('score-display').innerText = Math.floor(score);
            characters.forEach(c => updateHpBar(c));
        }

        function updateHpBar(char) {
            const wrapper = document.getElementById(char.hpBarId);
            const fill = document.getElementById(char.hpFillId);
            const status = document.getElementById(char.statusId);
            
            const headPos = char.pos.clone(); headPos.y += 35; headPos.project(camera);
            const x = (headPos.x * .5 + .5) * window.innerWidth;
            const y = (-(headPos.y * .5) + .5) * window.innerHeight;

            wrapper.style.left = x + 'px'; wrapper.style.top = y + 'px';
            status.style.left = x + 'px'; status.style.top = (y - 15) + 'px';
            
            const hpPct = Math.max(0, (char.hp / char.maxHp) * 100);
            fill.style.width = hpPct + '%';

            if (headPos.z > 1 || x < 0 || x > window.innerWidth || y < 0 || y > window.innerHeight) {
                wrapper.style.display = 'none'; status.style.display = 'none';
            } else {
                wrapper.style.display = 'block';
                if(char.isDown) status.style.display = 'block'; else status.style.display = 'none';
            }
        }

        function animate(time) {
            requestAnimationFrame(animate);
            TWEEN.update(time);

            if (gameActive) {
                let dx = 0, dz = 0;
                if (!cinematic.active) {
                    if (keys['ArrowUp'] || keys['KeyW']) dz = -1;
                    if (keys['ArrowDown'] || keys['KeyS']) dz = 1;
                    if (keys['ArrowLeft'] || keys['KeyA']) dx = -1;
                    if (keys['ArrowRight'] || keys['KeyD']) dx = 1;
                    if (joystick.active) { dx = joystick.x; dz = joystick.y; }
                }

                const player = characters[0];
                characters.forEach(char => {
                    if (char.isPlayer) char.update(dx, dz, timeScale);
                    else {
                        if (char.isDown || char.isDying) { char.update(0,0, timeScale); return; }
                        let target = null, minDist = 9999;
                        characters.forEach(other => {
                            if (other !== char && !other.isDown && !other.isDying) {
                                const d = char.pos.distanceTo(other.pos);
                                if (d < minDist) { minDist = d; target = other; }
                            }
                        });
                        let ax=0, az=0;
                        if (target) {
                            const dir = new THREE.Vector3().subVectors(target.pos, char.pos).normalize();
                            if (minDist > 160) { ax = dir.x; az = dir.z; } else { ax = -dir.z; az = dir.x; }
                        }
                        char.update(ax, az, timeScale);
                    }
                });

                for (let i = 0; i < characters.length; i++) {
                    for (let j = i + 1; j < characters.length; j++) {
                        const c1 = characters[i]; const c2 = characters[j];
                        
                        checkHit(c1.ballPos, c1.ballVel, c2, c1.heatFactor, c1.isPlayer, c1.isDown || c1.isDying);
                        checkHit(c2.ballPos, c2.ballVel, c1, c2.heatFactor, c2.isPlayer, c2.isDown || c2.isDying);
                        
                        if (c1.ballPos.distanceTo(c2.ballPos) < PHYSICS.ballRadius * 2) {
                             const n = new THREE.Vector3().subVectors(c1.ballPos, c2.ballPos).normalize();
                             c1.ballPos.add(n); c2.ballPos.sub(n);
                             const v = c1.ballVel.clone().sub(c2.ballVel).multiplyScalar(0.5);
                             c1.ballVel.sub(v); c2.ballVel.add(v);
                             particleSystem.spawn(c1.ballPos.clone().add(c2.ballPos).multiplyScalar(0.5), 15);
                        }
                    }
                }
                particleSystem.update(timeScale);
                updateUI();

                if (!cinematic.active) {
                    const targetPos = player.pos.clone().add(baseCamOffset);
                    camera.position.lerp(targetPos, 0.1);
                    cameraLookAtPos.copy(player.pos);
                    camera.lookAt(cameraLookAtPos);
                }
            }
            renderer.render(scene, camera);
        }

        function checkHit(bPos, bVel, victim, heat, isAttackerPlayer, attackerIsDown) {
            if (victim.isDown || victim.isDying || victim.invincibleTime > 0) return false;

            if (bPos.distanceTo(victim.pos) < PHYSICS.ballRadius + 10) {
                const spd = bVel.length();
                if (spd > 0.5) {
                    const isRed = heat > 0.9;
                    const kbForce = isRed ? 8 : 4;
                    const kb = bVel.clone().normalize().multiplyScalar(kbForce);
                    victim.vel.add(kb);

                    if (!attackerIsDown) {
                        const dir = new THREE.Vector3().subVectors(victim.pos, bPos).normalize();
                        const hitPos = victim.pos.clone().sub(dir.multiplyScalar(8));
                        const dmg = spd * 5 * (isRed ? 2.0 : 1.0);
                        
                        // Hit Score: Normal 10, Red 50
                        if (isAttackerPlayer) score += isRed ? 50 : 10;

                        const killed = victim.takeDamage(dmg, bVel.clone());
                        if (killed && isAttackerPlayer) score += 100;
                        
                        // Cinematic Trigger
                        if ((isAttackerPlayer || victim.isPlayer) && isRed) {
                            cinematic.start(victim);
                        }
                    }
                    particleSystem.spawn(victim.pos, 8);
                    return true;
                }
            }
            return false;
        }

        function setupUIAndInputs() {
            window.addEventListener('keydown', e => keys[e.code] = true);
            window.addEventListener('keyup', e => keys[e.code] = false);
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight);
            });
            const startFn = (e) => { e.preventDefault(); startGame(); };
            document.getElementById('start-btn').addEventListener('click', startFn);
            document.getElementById('start-btn').addEventListener('touchend', startFn);
            document.getElementById('restart-btn').addEventListener('click', startFn);
            document.getElementById('restart-btn').addEventListener('touchend', startFn);

            const toggleModal = (modal) => { modal.style.display = (modal.style.display === 'block') ? 'none' : 'block'; };
            document.getElementById('help-btn').addEventListener('click', (e) => { e.stopPropagation(); toggleModal(document.getElementById('help-modal')); });
            document.getElementById('close-help-btn').addEventListener('click', (e) => { e.stopPropagation(); toggleModal(document.getElementById('help-modal')); });
            document.getElementById('info-btn').addEventListener('click', (e) => { e.stopPropagation(); toggleModal(document.getElementById('info-modal')); });
            document.getElementById('close-info-btn').addEventListener('click', (e) => { e.stopPropagation(); toggleModal(document.getElementById('info-modal')); });

            const zone = document.getElementById('touch-zone');
            const joyBase = document.getElementById('joy-base');
            const joyKnob = document.getElementById('joy-knob');
            let startX=0, startY=0;
            zone.addEventListener('touchstart', e => {
                if (e.target.closest('.icon-btn') || e.target.closest('button')) return;
                e.preventDefault(); const t = e.changedTouches[0]; startX=t.clientX; startY=t.clientY;
                joyBase.style.display='block'; joyBase.style.left=startX+'px'; joyBase.style.top=startY+'px';
                joyKnob.style.transform='translate(-50%,-50%)'; joystick.active=true; joystick.x=0; joystick.y=0;
            }, {passive:false});
            zone.addEventListener('touchmove', e => {
                if(!joystick.active) return; e.preventDefault(); const t = e.changedTouches[0];
                let dx=t.clientX-startX; let dy=t.clientY-startY; const dist=Math.sqrt(dx*dx+dy*dy); const max=60;
                if(dist>max) { dx=(dx/dist)*max; dy=(dy/dist)*max; }
                joyKnob.style.transform=`translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
                joystick.x=dx/max; joystick.y=dy/max;
            }, {passive:false});
            const end = (e) => { if(joystick.active) { joystick.active=false; joystick.x=0; joystick.y=0; joyBase.style.display='none'; } };
            zone.addEventListener('touchend', end); zone.addEventListener('touchcancel', end);
        }

        init();
    </script>
