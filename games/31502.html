<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NECROS</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DotGothic16&display=swap');

        :root {
            --cga-cyan: #55ffff;
            --cga-magenta: #ff55ff;
            --cga-white: #ffffff;
            --cga-black: #000000;
            --cga-gray: #555555;
            --bg-color: #050505;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--cga-cyan);
            font-family: 'DotGothic16', 'Courier New', monospace;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            -webkit-user-select: none;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            background-color: #000;
            display: flex;
            overflow: hidden;
        }

        #scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.1) 50%,
                rgba(0,0,0,0.1)
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 999;
            opacity: 0.5;
        }

        .left-panel {
            width: 60%;
            height: 100%;
            position: relative;
            border-right: 4px solid var(--cga-gray);
            background-color: #111;
            display: flex;
            flex-direction: column;
        }

        .right-panel {
            width: 40%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background-color: #000;
        }

        #visual-display {
            flex-grow: 1;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            border-bottom: 4px solid var(--cga-gray);
            position: relative;
            min-height: 50%;
            overflow: hidden; 
        }

        .bg-pre-op { background-image: url('https://gdp-nlp-chat.cdn.sfmji.com/synclub-nlp-chat/gemini_image_generate_e56e8180-c288-4760-b705-015a291ddf2b_2026-01-11-13:07:33_cb3dfad4-6e55-462b-b2a8-2657837a4e49_1.png'); }
        .bg-surgery { background-image: url('https://gdp-nlp-chat.cdn.sfmji.com/synclub-nlp-chat/gemini_image_generate_9e1c8441-9bd8-4eed-b5be-323f3c42b097_2026-01-11-13:02:49_deaafe3f-e2e8-4d8a-a92c-458f2871e985_1.png'); }
        .bg-win { background-image: url('https://gdp-nlp-chat.cdn.sfmji.com/synclub-nlp-chat/gemini_image_generate_699cbaf0-3881-4a59-a5c7-fc5c0a91f13f_2026-01-11-13:07:33_bc874005-e663-4e04-ad04-52262c52df6b_1.png'); }
        .bg-loss { background-image: url('https://gdp-nlp-chat.cdn.sfmji.com/synclub-nlp-chat/gemini_image_generate_98be7eeb-b5b5-4dad-86c9-0e1a442b2f80_2026-01-11-13:07:30_d2786418-78a9-48e2-abdc-2bceff82fec3_1.png'); }

        #doctor-face {
            position: absolute;
            bottom: 10px;
            right: 10px;
            width: 15vh;
            height: 15vh;
            background-image: url('https://gdp-nlp-chat.cdn.sfmji.com/synclub-nlp-chat/gemini_image_generate_149056a7-1e94-45d1-8965-17c406405014_2026-01-11-13:07:32_dabf1672-0042-4375-b773-f05b4ef9279c_1.png');
            background-size: cover;
            border: 2px solid var(--cga-gray);
            z-index: 10;
            transition: transform 0.2s;
            transform-origin: center center;
        }

        .breathe-normal { animation: breathe 3s infinite ease-in-out; }
        @keyframes breathe { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }

        .face-death { 
            position: absolute !important;
            top: 50% !important;
            left: 50% !important;
            bottom: auto !important;
            right: auto !important;
            width: 100% !important;  
            height: 100% !important;
            background-size: contain !important; 
            background-repeat: no-repeat !important;
            background-position: center !important;
            transform: translate(-50%, -50%) scale(2.0) !important; 
            z-index: 50 !important;
            border: none !important;
            filter: contrast(1.5) brightness(0.6) hue-rotate(-20deg) !important;
            background-color: transparent !important;
            animation: creepy-zoom 5s linear forwards !important; 
        }

        @keyframes creepy-zoom { 
            0% { transform: translate(-50%, -50%) scale(2.0); } 
            100% { transform: translate(-50%, -50%) scale(4.5); } 
        }

        #log-area {
            height: 35%;
            padding: 20px;
            font-size: clamp(14px, 1.8vh, 22px);
            color: var(--cga-white);
            overflow-y: auto;
            background: #000;
            line-height: 1.5;
            border-top: 4px solid #222;
        }

        .log-entry { margin-bottom: 8px; border-bottom: 1px dashed #333; padding-bottom: 4px; }
        .log-success { color: var(--cga-cyan); }
        .log-danger { color: var(--cga-magenta); font-weight: bold;}
        .log-info { color: #aaaaaa; }

        .cursor::after {
            content: '█';
            animation: blink-cursor 1s infinite;
            margin-left: 5px;
            color: var(--cga-cyan);
        }
        @keyframes blink-cursor { 0% {opacity: 1;} 50% {opacity: 0;} 100% {opacity: 1;} }

        #monitor-area {
            flex-shrink: 0;
            padding: 10px;
            background: #051111;
            border-bottom: 4px solid var(--cga-gray);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        #status-box {
            background: #000;
            border: 2px solid var(--cga-magenta);
            padding: 10px;
            margin-top: 10px;
            text-align: center;
            min-height: 3em;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        #status-text {
            color: var(--cga-magenta);
            font-size: clamp(14px, 2vh, 28px);
            font-weight: bold;
            animation: blink 2s infinite;
        }

        .bar-container { width: 100%; height: 10px; background: #333; margin-top: 5px; position: relative; }
        .bar-fill { height: 100%; transition: width 0.2s; }
        #hr-bar { background: var(--cga-magenta); width: 100%; }
        
        .hr-display {
            font-size: 2rem;
            color: var(--cga-magenta);
            font-family: monospace;
            text-align: right;
        }

        #controls-area {
            flex-grow: 1;
            padding: 5px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: repeat(8, 1fr);
            grid-gap: 5px;
            overflow-y: auto;
        }

        .cmd-btn {
            background: #000;
            border: 2px solid var(--cga-cyan);
            color: var(--cga-cyan);
            font-family: 'DotGothic16', monospace;
            font-size: clamp(10px, 1.5vh, 16px);
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2px;
            text-align: center;
            box-shadow: 0 0 5px rgba(85, 255, 255, 0.1);
        }

        .sys-btn {
            background: #111;
            border: 2px solid var(--cga-white);
            color: var(--cga-white);
            font-family: 'DotGothic16', monospace;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 15px 40px;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }
        .sys-btn:hover { background: #333; }

        .cmd-btn:hover {
            background: var(--cga-cyan);
            color: #000;
            box-shadow: 0 0 10px var(--cga-cyan);
        }
        .cmd-btn:active { transform: scale(0.98); }
        .cmd-btn:disabled { border-color: #333; color: #555; pointer-events: none; }

        #start-overlay, #end-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 3000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .title-logo {
            font-size: clamp(4rem, 10vw, 7rem);
            color: var(--cga-magenta);
            text-shadow: 4px 4px var(--cga-cyan);
            margin: 0;
            letter-spacing: 0.1em;
            line-height: 1;
        }
        
        .ruby {
            font-size: clamp(1rem, 2vw, 1.5rem);
            color: var(--cga-white);
            letter-spacing: 0.5em;
            margin-bottom: -10px;
            display: block;
        }

        /* モーダル用スタイル */
        #record-modal {
            display: none;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 90%; max-width: 600px;
            height: 80%; max-height: 800px;
            background: rgba(0, 5, 5, 0.95);
            border: 2px solid var(--cga-cyan);
            z-index: 4000;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
            box-shadow: 0 0 20px rgba(85, 255, 255, 0.2);
        }
        #record-modal.active { display: flex; }
        .close-btn {
            position: absolute; top: 10px; right: 15px;
            color: var(--cga-cyan); font-size: 30px;
            cursor: pointer; background: none; border: none;
            font-family: monospace; line-height: 1; padding: 0;
        }
        .close-btn:hover { color: var(--cga-magenta); }
        #record-list {
            overflow-y: auto; flex-grow: 1; margin-top: 20px;
            display: flex; flex-direction: column; gap: 8px;
            padding-right: 10px;
        }
        .record-item {
            padding: 12px; border: 1px solid #333;
            font-family: 'DotGothic16', monospace; font-size: clamp(12px, 2vh, 18px);
            display: flex; justify-content: flex-start; align-items: center;
        }
        .record-item.cleared { color: var(--cga-cyan); border-color: var(--cga-cyan); background: rgba(85, 255, 255, 0.05); }
        .record-item.locked { color: var(--cga-gray); border-style: dashed; background: rgba(0, 0, 0, 0.5); }
        .record-no { width: 50px; color: var(--cga-magenta); }

        /* スクロールバー装飾 */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: var(--cga-gray); }
        ::-webkit-scrollbar-thumb:hover { background: var(--cga-cyan); }

        .hidden { display: none !important; }
        
        #ecg-canvas { width: 100%; height: 8vh; background: #000; border: 1px solid #1a3333; }
        .report-text { min-height: 100px; text-align: left; white-space: pre-wrap; font-size: 1.1rem; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="scanlines"></div>

    <div id="start-overlay">
        <div style="text-align: center;">
            <span class="ruby">ネクロス</span>
            <h1 class="title-logo">NECROS</h1>
        </div>
        <div style="display: flex; flex-direction: column; gap: 20px; margin-top: 50px; align-items: center;">
            <button class="sys-btn" onclick="startGame(true)">執刀開始</button>
            <button class="sys-btn" style="font-size: 1.2rem; padding: 10px 30px; border-color: var(--cga-gray); color: var(--cga-gray);" onclick="openRecords()">手術記録</button>
        </div>
    </div>

    <!-- 手術記録モーダル -->
    <div id="record-modal">
        <button class="close-btn" onclick="closeRecords()">×</button>
        <h2 style="margin:0; color:var(--cga-magenta); text-align:center; font-size: 1.8rem; letter-spacing: 0.1em;">COLLECTION</h2>
        <div id="record-list"></div>
    </div>

    <div id="end-overlay" class="hidden">
        <h1 id="end-title" style="font-size: clamp(2rem, 5vw, 4rem); margin-bottom: 20px;"></h1>
        <div style="width: 80%; max-width: 800px; background: #110000; border: 1px solid var(--cga-magenta); padding: 20px; margin-bottom: 20px;">
            <p id="end-msg" class="report-text cursor"></p>
        </div>
        <p style="font-size: 1.5rem; color: var(--cga-cyan);">スコア: <span id="final-score">0</span></p>
        <div style="display: flex; gap: 20px; margin-top: 30px;">
            <button id="btn-next" class="sys-btn hidden" onclick="startGame(false)">次の患者へ</button>
            <button id="btn-title" class="sys-btn hidden" onclick="returnToTitle()">タイトルへ</button>
        </div>
    </div>

    <div class="left-panel">
        <div id="visual-display" class="bg-pre-op">
            <div id="doctor-face"></div>
        </div>
        <div id="log-area"></div>
    </div>

    <div class="right-panel">
        <div id="monitor-area">
            <div id="top-buffer" style="height: 0px;"></div>
            
            <div style="display:flex; justify-content:space-between; align-items: flex-end; color:#555; font-size:0.8rem;">
                <span>VITAL MONITOR</span>
                <span class="hr-display">HR: <span id="hr-value">80</span></span>
            </div>
            <div class="bar-container"><div id="hr-bar" class="bar-fill"></div></div>
            <canvas id="ecg-canvas" width="400" height="60" style="margin-bottom:5px;"></canvas>
            
            <div id="status-box">
                <div id="status-text">準備中</div>
            </div>
        </div>

        <div id="controls-area"></div>
    </div>
</div>

<script>
    const screenHeight = window.innerHeight;
    const topExclusionHeight = screenHeight >= 812 ? 98 : 74;
    document.getElementById('top-buffer').style.height = (topExclusionHeight / 2) + 'px';

    const TOOLS = {
        ANESTHESIA: { name: "麻酔", action: "麻酔導入。意識消失を確認。" },
        ANTISEPTIC: { name: "消毒液", action: "術野の滅菌完了。" },
        SCALPEL:    { name: "メス", action: "切開/剥離に成功。" },
        RETRACTOR:  { name: "鈎(開創)", action: "術野を展開。視野良好。" },
        SUCTION:    { name: "吸引機", action: "血液・廃液を除去。" },
        FORCEPS:    { name: "鉗子", action: "対象を把持・摘出。" },
        E_KNIFE:    { name: "電気メス", action: "凝固止血・切離完了。" },
        CLIP:       { name: "クリップ", action: "血管を結紮・遮断。" },
        GRAFT:      { name: "人工血管", action: "置換・吻合完了。" },
        IRRIGATION: { name: "洗浄", action: "生理食塩水で洗浄。" },
        SUTURES:    { name: "縫合", action: "創部を閉鎖。" },
        BANDAGE:    { name: "包帯", action: "術後保護完了。" },
        DEFIB:      { name: "AED", action: "除細動実行。洞調律復帰。" },
        CARDIO_DRUG:{ name: "強心剤", action: "心収縮力増強。血圧安定。" },
        TRANSFUSION:{ name: "輸血", action: "循環血液量を維持。" },
        POOP:       { name: "ウンコ投入", action: "..." }
    };

    // 全症例の定義
    const SCENARIO_NAMES = {
        "TUMOR": "後腹膜腫瘍摘出術",
        "ANEURYSM": "脳動脈瘤クリッピング術",
        "TRAUMA": "腹部刺創緊急止血術",
        "BYPASS": "大腿膝窩動脈バイパス術",
        "APPENDICITIS": "急性虫垂炎切除術",
        "CESAREAN": "緊急帝王切開術",
        "CHOLECYST": "胆嚢摘出術",
        "HERNIA": "鼠径ヘルニア修復術",
        "TRANSPLANT": "生体腎移植術",
        "FOREIGN_BODY": "消化管内異物除去術",
        "VALVE": "大動脈弁置換術",
        "ABSCESS": "深頸部膿瘍切開排膿術",
        "COMPOSITE_A": "癒着剥離および腫瘍摘出術",
        "COMPOSITE_B": "多発外傷ダメージコントロール",
        "MYSTERY": "未知寄生虫摘出術",
        "GHOST": "心霊的外科治療"
    };

    let gameActive = false;
    let requiredSequence = [];
    let currentTask = null;
    let currentScenarioType = "";
    let score = 0;
    let combo = 0;
    let stage = 1;
    let lastActionTime = 0; 
    let ecgCtx = document.getElementById('ecg-canvas').getContext('2d');
    let ecgX = 0;
    let isFlatline = false;
    let isTyping = false;
    let animationFrameId = null;
    let heartRate = 80;
    let isMonitorSoundEnabled = true; 

    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = new AudioContext();

    function checkAudioContext() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playTone(freq, type, duration) {
        if (!audioCtx || !isMonitorSoundEnabled) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    }
    
    function playHeartbeat() {
        if (!gameActive || isFlatline) return;
        playTone(800, 'sawtooth', 0.08); 
    }
    
    function playFlatlineSound() {
        checkAudioContext();
        if (!isMonitorSoundEnabled) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(800, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 3); 
    }

    // --- コレクション（手術記録）関連 ---
    function saveRecord(scenarioId) {
        let records = JSON.parse(localStorage.getItem('necros_records')) || [];
        if (!records.includes(scenarioId)) {
            records.push(scenarioId);
            localStorage.setItem('necros_records', JSON.stringify(records));
        }
    }

    function openRecords() {
        const modal = document.getElementById('record-modal');
        const list = document.getElementById('record-list');
        list.innerHTML = "";
        let records = JSON.parse(localStorage.getItem('necros_records')) || [];
        
        let i = 1;
        for (const key in SCENARIO_NAMES) {
            const div = document.createElement('div');
            const noSpan = document.createElement('span');
            noSpan.className = "record-no";
            noSpan.innerText = `No.${i.toString().padStart(2, '0')}`;
            
            const titleSpan = document.createElement('span');
            if (records.includes(key)) {
                div.className = "record-item cleared";
                titleSpan.innerText = SCENARIO_NAMES[key];
            } else {
                div.className = "record-item locked";
                titleSpan.innerText = "？？？";
            }
            
            div.appendChild(noSpan);
            div.appendChild(titleSpan);
            list.appendChild(div);
            i++;
        }
        modal.classList.add('active');
    }

    function closeRecords() {
        document.getElementById('record-modal').classList.remove('active');
    }

    // --- ゲームフロー関連 ---
    function returnToTitle() {
        if(animationFrameId) cancelAnimationFrame(animationFrameId);
        document.getElementById('end-overlay').classList.add('hidden');
        document.getElementById('start-overlay').classList.remove('hidden');
        resetVisuals();
    }
    
    function resetVisuals() {
        const face = document.getElementById('doctor-face');
        face.className = 'breathe-normal'; 
        face.style = ''; 
        face.style.display = 'block';
    }

    function generateButtons() {
        const container = document.getElementById('controls-area');
        container.innerHTML = "";
        
        let keys = Object.keys(TOOLS).filter(k => k !== 'POOP');
        const poopIndex = Math.floor(Math.random() * (keys.length + 1));
        keys.splice(poopIndex, 0, 'POOP');
        
        keys.forEach(key => {
            const btn = document.createElement('button');
            btn.className = 'cmd-btn';
            btn.innerText = TOOLS[key].name;
            btn.onclick = () => executeCommand(key);
            container.appendChild(btn);
        });
    }

    function startGame(isNewGame) {
        checkAudioContext();
        if(animationFrameId) cancelAnimationFrame(animationFrameId);

        document.getElementById('start-overlay').classList.add('hidden');
        document.getElementById('end-overlay').classList.add('hidden');
        
        if(isNewGame) { 
            stage = 1; 
            score = 0; 
            combo = 0; 
        } else { 
            stage++; 
        }

        document.getElementById('visual-display').className = 'bg-pre-op';
        resetVisuals();
        
        heartRate = 80;
        isMonitorSoundEnabled = true;
        
        document.getElementById('status-text').innerText = "準備中";
        document.getElementById('end-msg').innerText = "";
        updateBars();
        
        gameActive = true;
        isFlatline = false;
        isTyping = false;
        lastActionTime = Date.now();
        
        document.getElementById('log-area').innerHTML = '';
        typeLog(`CASE ${stage}: オペ開始。`);
        
        generateScenario();
        generateButtons(); 
        nextTask();
        enableControlButtons(true);
        
        drawECG();
    }
    
    function updateBars() {
        document.getElementById('hr-value').innerText = Math.floor(heartRate);
        document.getElementById('hr-bar').style.width = Math.min(100, Math.max(0, heartRate)) + '%';
        
        const hrBar = document.getElementById('hr-bar');
        if(heartRate < 30) hrBar.style.background = 'red';
        else hrBar.style.background = 'var(--cga-magenta)';
    }

    function generateScenario() {
        requiredSequence = [];
        requiredSequence.push({ status: "患者搬入。意識あり。", tool: "ANESTHESIA", phase: "PRE_OP" });
        requiredSequence.push({ status: "皮膚が汚染されています", tool: "ANTISEPTIC", phase: "PRE_OP" });
        requiredSequence.push({ status: "切開が必要です", tool: "SCALPEL", phase: "PRE_OP" });
        requiredSequence.push({ status: "術野を確保してください", tool: "RETRACTOR", phase: "OPEN" });

        const scenarios = Object.keys(SCENARIO_NAMES);

    function nextTask() {
        lastActionTime = Date.now();
        if (requiredSequence.length > 0) {
            currentTask = requiredSequence.shift();
            if (currentTask.tool === 'DEFIB') heartRate = 0; 
            else if (currentTask.tool === 'CARDIO_DRUG' || currentTask.tool === 'TRANSFUSION') heartRate = 40; 
            else heartRate = 80; 
            updateBars();
            updateMonitor();
        } else {
            currentTask = { status: "処置完了。閉腹可能です", tool: "SUTURES" };
            heartRate = 80;
            updateBars();
            updateMonitor();
        }
    }

    function updateMonitor() {
        if(!gameActive) return;
        const statusEl = document.getElementById('status-text');
        statusEl.innerText = currentTask.status;
        statusEl.style.color = (currentTask.phase === 'EMERGENCY') ? 'var(--cga-magenta)' : 'var(--cga-cyan)';
    }

    function calculateScore() {
        const now = Date.now();
        const diff = now - lastActionTime;
        const timeBonus = Math.max(0, 5000 - diff) / 10;
        const baseScore = 100;
        const comboMultiplier = 1.0 + (combo * 0.1);
        
        const earned = Math.floor((baseScore + timeBonus) * comboMultiplier);
        score += earned;
        combo++;
        return earned;
    }

    function executeCommand(toolKey) {
        checkAudioContext();
        if (!gameActive || isTyping) return;

        typeLog(`> ${TOOLS[toolKey].name} 使用...`);

        if (toolKey === 'BANDAGE') {
             if (currentTask.tool === 'BANDAGE') {
                 calculateScore();
                 handleSuccess(toolKey);
                 setTimeout(generateSuccessReport, 1000); 
             } else {
                 generateFailure(toolKey, "NORMAL"); 
             }
             return;
        }

        if (toolKey === 'DEFIB') {
            if (currentTask.tool === 'DEFIB') {
                heartRate = 80; updateBars();
                handleSuccess(toolKey);
            } else {
                generateFailure(toolKey, "NORMAL");
            }
            return;
        }

        if (toolKey === 'POOP') {
            generateFailure(toolKey, "POOP");
            return;
        }

        if (toolKey === currentTask.tool) {
            handleSuccess(toolKey);
        } else {
            if (toolKey === 'SUTURES') {
                generateFailure(toolKey, "UNFINISHED");
            } else {
                generateFailure(toolKey, "NORMAL");
            }
        }
    }

    function handleSuccess(toolKey) {
        if (toolKey === 'SCALPEL') {
            document.getElementById('visual-display').className = 'bg-surgery';
            typeLog("開腹。", "log-danger");
        }
        calculateScore(); 
        typeLog(`OK: ${TOOLS[toolKey].action}`, "log-success");

        if (toolKey === 'SUTURES') {
            if (requiredSequence.length === 0) {
                document.getElementById('visual-display').className = 'bg-win'; 
                typeLog("閉腹完了。", "log-success");
                currentTask = { status: "術部保護が必要です", tool: "BANDAGE" };
                updateMonitor();
                return; 
            }
        }
        
        if (toolKey !== 'BANDAGE') nextTask();
    }

換気不全による重篤な低酸素血症と高二酸化炭素血症を来し、窒息による心停止に至った。`; break;
                case "DEFIB":
                    reason = `【死因: R-on-T現象による心室細動】\n
洞調律（正常心拍）が維持されている心臓に対し、受攻期（T波の頂点付近）に電気ショックを与えた。
これにより電気的興奮の不均一が生じ、致死性不整脈である心室細動(Vf)が誘発され、逆説的に心停止を招いた。`; break;
                case "CARDIO_DRUG":
                    reason = `【死因: 心破裂および高血圧性脳出血】\n
強心・昇圧薬の不適切な過量投与により、心筋収縮力と血圧が異常なレベルまで上昇。
心室内圧の急上昇に心壁が耐えきれず心破裂（左室自由壁破裂）、あるいは脳血管の破綻による大量脳出血を引き起こした。`; break;
                case "TRANSFUSION":
                    reason = `【死因: 溶血性輸血反応】\n
ABO式血液型の不適合輸血により、抗原抗体反応による急激な血管内溶血が発生。
遊離ヘモグロビンによる急性腎不全、および播種性血管内凝固(DIC)の併発により、多臓器不全に至り死亡した。`; break;
                default:
                    reason = `【死因: 術中管理不全】\n
[${wName}]の医学的適応のない使用により、患者の生理学的恒常性が破綻。
予期せぬ生体反応と合併症の連鎖により、救命困難な状態に陥った。`;
            }
        }

        const report = `[検死報告]\n誤選択: [${wName}]\n正解: [${TOOLS[currentTask.tool].name}]\n\n${reason}`;
        setTimeout(() => gameOver(report), 2000);
    }

    function typeText(element, text, speed, callback) {
        let i = 0; isTyping = true; element.innerHTML = "";
        const span = document.createElement('span');
        element.appendChild(span); element.classList.add('cursor');
        function type() {
            if (i < text.length) {
                span.innerText += text.charAt(i); i++;
                if(element.id==='log-area'||element.parentElement.id==='log-area') 
                    document.getElementById('log-area').scrollTop = document.getElementById('log-area').scrollHeight;
                setTimeout(type, speed);
            } else {
                element.classList.remove('cursor'); isTyping = false;
                if (callback) callback();
            }
        }
        type();
    }

    function typeLog(text, className = "") {
        const area = document.getElementById('log-area');
        const div = document.createElement('div');
        div.className = `log-entry ${className}`;
        area.appendChild(div);
        typeText(div, text, 15, null);
    }

    function enableControlButtons(enabled) {
        const buttons = document.querySelectorAll('#controls-area .cmd-btn');
        buttons.forEach(btn => btn.disabled = !enabled);
    }

    function gameWin(text) {
        document.getElementById('visual-display').className = 'bg-win';
        const overlay = document.getElementById('end-overlay');
        overlay.classList.remove('hidden');
        document.getElementById('end-title').innerText = "手術成功";
        document.getElementById('end-title').style.color = "var(--cga-cyan)";
        document.getElementById('btn-next').classList.remove('hidden');
        document.getElementById('btn-title').classList.add('hidden');
        typeText(document.getElementById('end-msg'), text, 20, null);
        document.getElementById('final-score').innerText = score;
        reportScore(score);
    }

    function gameOver(reportText) {
        document.getElementById('visual-display').className = 'bg-loss';
        const overlay = document.getElementById('end-overlay');
        overlay.classList.remove('hidden');
        document.getElementById('end-title').innerText = "死亡確認";
        document.getElementById('end-title').style.color = "var(--cga-magenta)";
        document.getElementById('btn-next').classList.add('hidden');
        document.getElementById('btn-title').classList.remove('hidden');
        typeText(document.getElementById('end-msg'), reportText, 20, null);
        document.getElementById('final-score').innerText = score;
        reportScore(score);
    }

    function reportScore(finalScore) {
        if (window.parent) window.parent.postMessage({ type: 'gameOver', score: finalScore }, '*');
    }

    function drawECG() {
        if (!gameActive && !isFlatline) return;
        const w = ecgCtx.canvas.width;
        const h = ecgCtx.canvas.height;
        const midH = h / 2;
        ecgCtx.lineWidth = 2;
        ecgCtx.lineCap = 'round';
        ecgCtx.fillStyle = 'rgba(5, 17, 17, 0.2)';
        ecgCtx.fillRect(0, 0, w, h);
        ecgCtx.beginPath();
        ecgCtx.strokeStyle = isFlatline ? '#ff0000' : '#55ffff';
        ecgCtx.moveTo(ecgX, midH);
        const speed = 2; 
        ecgX += speed;
        if (ecgX > w) ecgX = 0;
        let y = midH;
        if (!isFlatline) {
            const beatWidth = w/3;
            const beatPos = ecgX % beatWidth; 
            if (heartRate > 0) {
                if (beatPos > 50 && beatPos < 60) y = midH - 25; 
                else if (beatPos >= 60 && beatPos < 70) y = midH + 15; 
                else if (beatPos >= 70 && beatPos < 80) y = midH - 5; 
                if (beatPos >= 50 && beatPos < 50 + speed) playHeartbeat();
            }
            y += (Math.random() - 0.5) * 2;
        } else {
            y = midH;
        }
        ecgCtx.lineTo(ecgX, y);
        ecgCtx.stroke();
        if (gameActive || isFlatline) {
            animationFrameId = requestAnimationFrame(drawECG);
        }
    }
</script>
