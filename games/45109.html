<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ネジはずし</title>
    <style>
        /* Web特有機能の無効化（長押し選択やルーペの禁止） */
        * {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #333;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
        }
        canvas {
            display: block;
        }
        #ui-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
        }
        .screen {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            color: white;
            z-index: 10;
        }
        
        /* タイトルロゴ演出 */
        .title-container {
            position: relative;
            display: inline-block;
            margin-bottom: 10px;
        }
        #title-logo {
            position: relative;
            z-index: 2;
            font-size: 48px;
            margin: 0;
            text-shadow: 2px 2px 4px #000;
            text-align: center;
            color: #fff;
            animation: pulseLogo 2s infinite ease-in-out;
        }
        @keyframes pulseLogo {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        /* 背景の回転ネジ (明るさ50%に暗くする) */
        .bg-screws {
            position: absolute;
            top: 50%; left: 50%;
            width: 100%; height: 100%;
            transform: translate(-50%, -50%);
            z-index: 1;
            pointer-events: none;
            filter: brightness(0.5);
        }
        .bg-screw {
            position: absolute;
            width: 60px; height: 60px;
            border-radius: 50%;
            border: 3px solid rgba(0,0,0,0.5);
            background: radial-gradient(circle, rgba(255,255,255,0.4) 0%, rgba(0,0,0,0.4) 100%);
            box-shadow: 0 4px 8px rgba(0,0,0,0.6);
            animation: rotateBgScrew 4s linear infinite;
        }
        .bg-screw::before, .bg-screw::after {
            content: '';
            position: absolute;
            background: rgba(255,255,255,0.6);
            border: 1px solid rgba(0,0,0,0.4);
            box-sizing: border-box;
        }
        .bg-screw::before {
            top: 5px; bottom: 5px; left: 26px; right: 26px;
        }
        .bg-screw::after {
            left: 5px; right: 5px; top: 26px; bottom: 26px;
        }
        @keyframes rotateBgScrew {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .bg-screw-red { background-color: #ff4757; top: -15px; left: -40px; animation-duration: 5s; animation-direction: reverse; }
        .bg-screw-green { background-color: #2ed573; top: 0px; right: -40px; animation-duration: 6s; }
        .bg-screw-blue { background-color: #1e90ff; bottom: -25px; left: 50%; margin-left: -30px; animation-duration: 4.5s; }

        p.desc-text {
            font-size: 14px;
            margin-bottom: 30px;
            text-align: center;
            color: #aaa; /* ロゴよりも暗い色に設定 */
            line-height: 1.5;
            position: relative;
            z-index: 2;
        }
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 80%;
            max-width: 300px;
            position: relative;
            z-index: 2;
        }
        button.action-btn {
            padding: 15px 0;
            width: 100%;
            font-size: 22px;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 6px 0 #b2bec3, 0 10px 10px rgba(0,0,0,0.4);
            transition: all 0.1s;
        }
        button.btn-retry {
            background: linear-gradient(135deg, #00b894, #00cec9);
            padding: 23px 0; /* 縦幅約1.5倍サイズに変更 */
        }
        button.btn-score {
            background: linear-gradient(135deg, #ff7675, #d63031);
        }
        button.btn-endless {
            background: linear-gradient(135deg, #74b9ff, #0984e3);
        }
        button.action-btn:active {
            transform: translateY(6px);
            box-shadow: 0 0px 0 #b2bec3, 0 4px 4px rgba(0,0,0,0.4);
        }
        .header-ui {
            position: absolute;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            box-sizing: border-box;
            pointer-events: none;
            z-index: 5;
        }
        .header-text {
            font-size: 18px;
            font-weight: bold;
            color: white;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.9), -1px -1px 3px rgba(0,0,0,0.9);
        }
        
        #timerDisplay {
            position: absolute;
            width: 100%;
            text-align: center;
            font-size: 36px;
            font-weight: bold;
            color: #fff;
            text-shadow: 1px 1px 3px #000, -1px -1px 3px #000;
            pointer-events: none;
            z-index: 5;
            transition: color 0.3s, text-shadow 0.3s;
        }

        #bgmBtn {
            position: absolute;
            pointer-events: auto;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            border: 2px solid rgba(255,255,255,0.5);
            color: white;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 6;
            backdrop-filter: blur(2px);
        }

    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">

        <div id="start-screen" class="screen">
            <div class="title-container">
                <div class="bg-screws">
                    <div class="bg-screw bg-screw-red"></div>
                    <div class="bg-screw bg-screw-green"></div>
                    <div class="bg-screw bg-screw-blue"></div>
                </div>
                <h1 id="title-logo">ネジはずし</h1>
            </div>
            <p class="desc-text">タップでネジを外し、同じ色を３つ揃えよう<br>板を全て落とせばクリア！</p>
            <div class="button-group">
                <button class="action-btn btn-score" onclick="startGame('score')">スコアアタック<br><span style="font-size:12px;">(120秒)</span></button>
                <button class="action-btn btn-endless" onclick="startGame('endless')">エンドレス<br><span style="font-size:12px;">(時間無制限)</span></button>
            </div>
        </div>
        <div id="game-over-screen" class="screen" style="display:none;">
            <h1 id="go-title" style="font-size: 42px; margin-bottom: 5px; text-shadow: 2px 2px 4px #000; text-align: center;">ゲームオーバー</h1>
            <p id="go-reason">空きストックがなくなった！</p>
            <div id="score-result" style="display:none;">
                <p>最終スコア: <span id="end-score" style="font-weight:bold; font-size:24px;">0</span></p>
                <p>最高スコア: <span id="high-score" style="color:#fdcb6e; font-weight:bold;">0</span></p>
                <p id="new-record-msg" style="color:#ff7675; font-weight:bold; display:none;">✨ NEW RECORD! ✨</p>
            </div>
            <div id="endless-result" style="display:none;">
                <p>到達レベル: <span id="end-level" style="font-weight:bold; font-size:24px;">1</span></p>
            </div>
            <div class="button-group" style="margin-top:20px;">
                <button class="action-btn btn-retry" onclick="retryGame()">リトライ</button>
                <button class="action-btn btn-score" onclick="showTitle()">タイトルへ戻る</button>
            </div>
        </div>
        
        <div id="header-bar" class="header-ui" style="display:none;">
            <div id="levelDisplay" class="header-text">レベル: 1</div>
            <div id="scoreDisplay" class="header-text">スコア: 0</div>
        </div>
        
        <div id="timerDisplay" style="display:none;">⏳ 120</div>
        
        <button id="bgmBtn" onclick="toggleBGM()" style="display:none;">🔈</button>
    </div>

    <script>
        // [必須要件] 親ページのヘッダー領域除外
        const screenHeight = window.innerHeight;
        const topExclusionHeight = screenHeight >= 812 ? 98 : 74;


        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // 背景
        const bgImg = new Image();
        bgImg.src = 'https://gdp-nlp-chat.cdn.sfmji.com/synclub-nlp-chat/gemini_image_generate_e44620c7-9d51-4bab-aff3-ba17bfbe4e87_2026-09-04-13:17:49_3402fa8f-d771-4106-b57e-603bc17b7669_2.png';

        // 状態・変数
        let gameState = 'start'; 
        let gameMode = 'score'; 
        let score = 0;
        let currentLevel = 1;
        
        let gameTime = 120;
        let lastTimestamp = 0;
        
        let virtualCenterX = 0;
        let virtualCenterY = 0;

        // 色指定 (赤, 緑, 青, 黄, 紫, 黒)
        const COLORS = ['#ff4757', '#2ed573', '#1e90ff', '#ffa502', '#9b59b6', '#2f3542'];
        
        let allScrews = [];
        let plates = [];
        let tray = []; 
        let visualTray = []; 
        let matchAnimations = []; 
        const MAX_TRAY_SLOTS = 7;

        let highScore = localStorage.getItem('screwJamHighScore') || 0;

        // --- オーディオシステム ---
        let audioCtx;
        let bgmGainNode = null;
        let isBgmPlaying = false;
        let isBgmEnabled = true; 
        let bgmSequenceTimeout = null;
        let generatedMelody = [];

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }
        
        function toggleBGM() {
            initAudio();
            isBgmEnabled = !isBgmEnabled;
            const btn = document.getElementById('bgmBtn');
            if (isBgmEnabled) {
                btn.style.opacity = '1';
                btn.innerText = '🔈';
                if (gameState === 'playing' || gameState === 'level_transition') {
                    playCuteBGM();
                }
            } else {
                btn.style.opacity = '0.5';
                btn.innerText = '🔇';
                stopBGM();
            }
        }

        function generateRandomMelody() {
            const scale = [523.25, 587.33, 659.25, 698.46, 783.99, 880.00, 987.77, 1046.50];
            const durations = [0.3, 0.3, 0.6];
            let melody = [];
            for(let i=0; i<12; i++) {
                const fIndex = Math.floor(Math.random() * scale.length);
                const freq = scale[fIndex];
                const chordOffset = (Math.random() > 0.5) ? 2 : 4; 
                const chordFreq = scale[Math.min(fIndex + chordOffset, scale.length-1)];
                melody.push({ 
                    f: freq, 
                    cf: chordFreq, 
                    d: durations[Math.floor(Math.random() * durations.length)] 
                });
            }
            return melody;
        }

        function playCuteBGM() {
            if (!audioCtx || !isBgmEnabled || isBgmPlaying) return;
            isBgmPlaying = true;
            
            if (generatedMelody.length === 0) {
                generatedMelody = generateRandomMelody();
            }
            let noteIndex = 0;
            
            bgmGainNode = audioCtx.createGain();
            bgmGainNode.gain.value = 0.12;
            bgmGainNode.connect(audioCtx.destination);
            
            function playNextNote() {
                if (!isBgmPlaying) return;
                
                let tempoMultiplier = 1.5; 
                if (gameMode === 'score') {
                    tempoMultiplier = 1.0; 
                    if (gameTime <= 10) {
                        tempoMultiplier = 0.6; 
                    }
                }

                const note = generatedMelody[noteIndex % generatedMelody.length];
                const now = audioCtx.currentTime;
                const actualDuration = note.d * tempoMultiplier;
                
                const osc = audioCtx.createOscillator();
                osc.type = 'sine';
                osc.frequency.value = note.f;
                const noteGain = audioCtx.createGain();
                osc.connect(noteGain);
                noteGain.connect(bgmGainNode);
                
                noteGain.gain.setValueAtTime(0, now);
                noteGain.gain.linearRampToValueAtTime(1, now + 0.05);
                noteGain.gain.exponentialRampToValueAtTime(0.01, now + actualDuration);
                
                osc.start(now);
                osc.stop(now + actualDuration);

                const chordOsc = audioCtx.createOscillator();
                chordOsc.type = 'triangle';
                chordOsc.frequency.value = note.cf;
                const chordGain = audioCtx.createGain();
                chordOsc.connect(chordGain);
                chordGain.connect(bgmGainNode);
                
                chordGain.gain.setValueAtTime(0, now);
                chordGain.gain.linearRampToValueAtTime(0.5, now + 0.05);
                chordGain.gain.exponentialRampToValueAtTime(0.01, now + actualDuration);
                
                chordOsc.start(now);
                chordOsc.stop(now + actualDuration);
                
                noteIndex++;
                bgmSequenceTimeout = setTimeout(playNextNote, actualDuration * 1000); 
            }
            playNextNote();
        }

        function stopBGM(fadeOut = false) {
            isBgmPlaying = false;
            clearTimeout(bgmSequenceTimeout);
            if (bgmGainNode) {
                if (fadeOut && audioCtx) {
                    const now = audioCtx.currentTime;
                    bgmGainNode.gain.setValueAtTime(bgmGainNode.gain.value, now);
                    bgmGainNode.gain.linearRampToValueAtTime(0, now + 1.0);
                } else {
                    bgmGainNode.disconnect();
                }
                bgmGainNode = null;
            }
        }

        // SE系
        function playPopSE() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = 'sine';
            const now = audioCtx.currentTime;
            osc.frequency.setValueAtTime(400, now);
            osc.frequency.exponentialRampToValueAtTime(1200, now + 0.05);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
            osc.start(now);
            osc.stop(now + 0.05);
        }

        function playSparkleSE() {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            [1200, 1600].forEach((freq, idx) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = 'triangle';
                const startTime = now + (idx * 0.05);
                osc.frequency.setValueAtTime(freq, startTime);
                osc.frequency.linearRampToValueAtTime(freq + 400, startTime + 0.2);
                gain.gain.setValueAtTime(0, startTime);
                gain.gain.linearRampToValueAtTime(0.2, startTime + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.01, startTime + 0.3);
                osc.start(startTime);
                osc.stop(startTime + 0.3);
            });
        }

        function playDropSE() {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const notes = [880, 1108.73, 1318.51, 1760];
            notes.forEach((freq, idx) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = 'sine';
                const startTime = now + (idx * 0.06);
                osc.frequency.setValueAtTime(freq, startTime);
                gain.gain.setValueAtTime(0, startTime);
                gain.gain.linearRampToValueAtTime(0.2, startTime + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.01, startTime + 0.2);
                osc.start(startTime);
                osc.stop(startTime + 0.2);
            });
        }
        
        // ゲームオーバージングル
        function playGameOverSE() {
            if (!audioCtx || !isBgmEnabled) return;
            const now = audioCtx.currentTime;
            const notes = [
                { f: 349.23, d: 0.15 }, // F4
                { f: 329.63, d: 0.15 }, // E4
                { f: 293.66, d: 0.15 }, // D4
                { f: 261.63, d: 0.5 }   // C4
            ];
            let timeOffset = 0;
            notes.forEach(note => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.value = note.f;
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                gain.gain.setValueAtTime(0, now + timeOffset);
                gain.gain.linearRampToValueAtTime(0.15, now + timeOffset + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.01, now + timeOffset + note.d);
                
                osc.start(now + timeOffset);
                osc.stop(now + timeOffset + note.d);
                
                timeOffset += note.d;
            });
        }

        function updateUITexts() {
            document.getElementById('levelDisplay').innerText = `レベル: ${currentLevel}`;
            if (gameMode === 'score') {
                document.getElementById('scoreDisplay').innerText = `スコア: ${score}`;
                const timerEl = document.getElementById('timerDisplay');
                timerEl.innerText = `⏳ ${Math.ceil(gameTime)}`;
                
                if (gameTime <= 10 && gameTime > 0) {
                    timerEl.style.color = '#ff4757';
                    timerEl.style.textShadow = '0 0 10px #ff4757, 1px 1px 3px #000, -1px -1px 3px #000';
                } else {
                    timerEl.style.color = '#fff';
                    timerEl.style.textShadow = '1px 1px 3px #000, -1px -1px 3px #000';
                }
            } else {
                document.getElementById('scoreDisplay').innerText = ``;
                document.getElementById('timerDisplay').innerText = ``;
            }
        }

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            // 盤面の中心位置を計算 (スマホなど下にはみ出ないよう上に補正)
            virtualCenterX = canvas.width / 2;
            virtualCenterY = topExclusionHeight + 120 + (canvas.height - topExclusionHeight) * 0.4;
            
            const slotW = 42;
            const spacing = 6;
            const totalW = MAX_TRAY_SLOTS * slotW + (MAX_TRAY_SLOTS - 1) * spacing;
            const startX = canvas.width / 2 - totalW / 2;
            
            const trayTopY = getTraySlotY() - 32;
            document.getElementById('header-bar').style.top = Math.max(topExclusionHeight, trayTopY - 35) + 'px';
            
            const timerY = getTraySlotY() + 45;
            document.getElementById('timerDisplay').style.top = timerY + 'px';
            
            const btn = document.getElementById('bgmBtn');
            const btnLeft = Math.min(startX + totalW + 10, canvas.width - 50); 
            btn.style.left = btnLeft + 'px';
            btn.style.top = (getTraySlotY() + 30) + 'px';

            allScrews.forEach(s => {
                if (s.state === 'board') {
                    s.x = virtualCenterX + s.boardX;
                    s.y = virtualCenterY + s.boardY;
                }
            });
            updateTrayTargets();
        }
        window.addEventListener('resize', resize);

        function generateLevel(levelIndex) {
            plates = [];
            matchAnimations = [];
            
            allScrews = allScrews.filter(s => s.state !== 'board');
            
            let screwIdCounter = Date.now();
            let plateIdCounter = 0;

            const numColors = Math.min(3 + Math.floor((levelIndex - 1) / 3), 6);
            const levelColors = COLORS.slice(0, numColors);
            const numLayers = Math.min(2 + Math.floor(levelIndex / 2), 6);
            
            const gridX = [-140, -60, 20, 100];
            const gridY = [-180, -90, 0, 90, 180];

            let newBoardScrews = [];

            for (let z = 0; z < numLayers; z++) {
                const numPlates = 1 + Math.floor(Math.random() * 2);
                for (let i = 0; i < numPlates; i++) {
                    const gx = Math.floor(Math.random() * (gridX.length - 1));
                    const gy = Math.floor(Math.random() * (gridY.length - 1));
                    const gw = 1 + Math.floor(Math.random() * (gridX.length - 1 - gx));
                    const gh = 1 + Math.floor(Math.random() * (gridY.length - 1 - gy));

                    const px = gridX[gx] - 15;
                    const py = gridY[gy] - 15;
                    const pw = (gridX[gx + gw] - gridX[gx]) + 30;
                    const ph = (gridY[gy + gh] - gridY[gy]) + 30;

                    let pts = [
                        {x: gridX[gx], y: gridY[gy]},
                        {x: gridX[gx + gw], y: gridY[gy]},
                        {x: gridX[gx], y: gridY[gy + gh]},
                        {x: gridX[gx + gw], y: gridY[gy + gh]},
                    ];
                    pts.sort(() => Math.random() - 0.5);
                    
                    const numScrews = 2 + Math.floor(Math.random() * (pts.length - 1));
                    let plateScrewIds = [];
                    
                    for (let k = 0; k < Math.min(numScrews, pts.length); k++) {
                        const pt = pts[k];
                        const existingScrew = newBoardScrews.find(s => Math.hypot(s.boardX - pt.x, s.boardY - pt.y) < 30);
                        
                        if (existingScrew) {
                            if (!plateScrewIds.includes(existingScrew.id)) {
                                plateScrewIds.push(existingScrew.id);
                                existingScrew.highestPlateIdx = Math.max(existingScrew.highestPlateIdx, z);
                            }
                        } else {
                            const newScrew = {
                                id: screwIdCounter++, boardX: pt.x, boardY: pt.y, color: '', state: 'board', 
                                x:0, y:0, targetX:0, targetY:0, scale:1, isMatched:false, highestPlateIdx: z, flash:false, visualIndex: -1
                            };
                            newBoardScrews.push(newScrew);
                            allScrews.push(newScrew);
                            plateScrewIds.push(newScrew.id);
                        }
                    }

                    if (plateScrewIds.length >= 2) {
                        plates.push({
                            id: 'p' + plateIdCounter++,
                            x: px, y: py, w: pw, h: ph,
                            color: `hsla(${Math.floor(Math.random()*360)}, 60%, 65%, 0.95)`,
                            screws: plateScrewIds, zLayer: z,
                            isFalling: false, yOffset: 0, rotation: 0, vy: 0, vr: 0
                        });
                    }
                }
            }

            const totalBoardScrews = newBoardScrews.length;
            const remainder = totalBoardScrews % 3;
            let adjustCount = (3 - remainder) % 3;
            while(adjustCount > 0) {
                const newScrewId = screwIdCounter++;
                const nx = -120 + Math.random() * 240;
                const ny = -160 + Math.random() * 320;
                const newScrew = {
                    id: newScrewId, boardX: nx, boardY: ny, color: '', state: 'board', 
                    x:0, y:0, targetX:0, targetY:0, scale:1, isMatched:false, highestPlateIdx: -1, flash:false, visualIndex: -1
                };
                newBoardScrews.push(newScrew);
                allScrews.push(newScrew);
                adjustCount--;
            }

            let colorAssignments = [];
            for (let i = 0; i < newBoardScrews.length / 3; i++) {
                const c = levelColors[Math.floor(Math.random() * levelColors.length)];
                colorAssignments.push(c, c, c);
            }
            colorAssignments.sort(() => Math.random() - 0.5);
            newBoardScrews.forEach((s, idx) => { s.color = colorAssignments[idx]; });
            
            // 【バグ修正】重なりチェック処理の改善
            // 視覚的に「この板よりも手前（または同じ階層）に描画されるネジ」が重なっている時だけ、
            // そのネジはこの板を貫通して止めていると判定する。
            plates.forEach(p => {
                allScrews.forEach(s => {
                    if (s.state === 'board' && !p.screws.includes(s.id)) {
                        const localX = s.boardX - p.x;
                        const localY = s.boardY - p.y;
                        if (localX >= 0 && localX <= p.w && localY >= 0 && localY <= p.h) {
                            if (p.zLayer <= s.highestPlateIdx) {
                                p.screws.push(s.id);
                            }
                        }
                    }
                });
            });
        }

        function showTitle() {
            document.getElementById('game-over-screen').style.display = 'none';
            document.getElementById('start-screen').style.display = 'flex';
            document.getElementById('header-bar').style.display = 'none';
            document.getElementById('timerDisplay').style.display = 'none';
            document.getElementById('bgmBtn').style.display = 'none';
            stopBGM();
        }

        function retryGame() {
            document.getElementById('game-over-screen').style.display = 'none';
            startGame(gameMode);
        }

        function startGame(mode) {
            initAudio();
            gameMode = mode;
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('header-bar').style.display = 'flex';
            document.getElementById('bgmBtn').style.display = 'flex';
            
            if (gameMode === 'score') {
                document.getElementById('timerDisplay').style.display = 'block';
            } else {
                document.getElementById('timerDisplay').style.display = 'none';
            }
            
            score = 0;
            currentLevel = 1;
            gameTime = 120;
            tray = [];
            visualTray = [];
            allScrews = [];
            generatedMelody = generateRandomMelody();
            initLevel();
        }

        function initLevel() {
            gameState = 'playing';
            updateUITexts();
            generateLevel(currentLevel);
            resize();
            
            if (!isBgmPlaying && isBgmEnabled) {
                playCuteBGM();
            }
            lastTimestamp = performance.now();
            requestAnimationFrame(loop);
        }

        function getTraySlotX(index) {
            const slotW = 42;
            const spacing = 6;
            const totalW = MAX_TRAY_SLOTS * slotW + (MAX_TRAY_SLOTS - 1) * spacing;
            const startX = canvas.width / 2 - totalW / 2;
            return startX + slotW/2 + index * (slotW + spacing);
        }

        function getTraySlotY() {
            return topExclusionHeight + 70;
        }

        function updateTrayTargets() {
            visualTray.forEach((s, index) => {
                if (s.state !== 'popping' && s.state !== 'done') {
                    s.targetX = getTraySlotX(index);
                    s.targetY = getTraySlotY();
                }
            });
        }

        function isScrewCovered(screw) {
            if (screw.state !== 'board') return false;
            for (let i = 0; i < plates.length; i++) {
                const p = plates[i];
                if (p.isFalling) continue;
                if (p.screws.includes(screw.id)) continue;
                
                if (p.zLayer > screw.highestPlateIdx) {
                    let localX, localY;
                    if (p.screws.length === 1 && p.pivotId !== undefined) {
                        const dx = screw.boardX - p.pivotX;
                        const dy = screw.boardY - p.pivotY;
                        const cos = Math.cos(-p.rotation);
                        const sin = Math.sin(-p.rotation);
                        const rx = dx * cos - dy * sin;
                        const ry = dx * sin + dy * cos;
                        localX = rx - (p.x - p.pivotX);
                        localY = ry - (p.y - p.pivotY);
                    } else {
                        localX = screw.boardX - p.x;
                        localY = screw.boardY - p.y;
                    }
                    if (localX >= -16 && localX <= p.w + 16 &&
                        localY >= -16 && localY <= p.h + 16) {
                        return true;
                    }
                }
            }
            return false;
        }

        // プレイヤーの操作が無効か判定する
        function isPlayerOperationDisabled() {
            let activePlatesCount = plates.filter(p => !p.isFalling).length;
            return (activePlatesCount === 0 && plates.length > 0);
        }

        function triggerGameOver(reason) {
            gameState = 'lose';
            stopBGM();
            playGameOverSE();
            document.getElementById('go-reason').innerText = reason;
            document.getElementById('game-over-screen').style.display = 'flex';
            
            if (gameMode === 'score') {
                document.getElementById('score-result').style.display = 'block';
                document.getElementById('endless-result').style.display = 'none';
                document.getElementById('end-score').innerText = score;
                
                let isNewRecord = false;
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('screwJamHighScore', highScore);
                    isNewRecord = true;
                }
                
                document.getElementById('high-score').innerText = highScore;
                document.getElementById('new-record-msg').style.display = isNewRecord ? 'block' : 'none';
                
                if (isNewRecord) {
                    reportScore();
                }
            } else {
                document.getElementById('score-result').style.display = 'none';
                document.getElementById('endless-result').style.display = 'block';
                document.getElementById('end-level').innerText = currentLevel;
            }
        }

        function onScrewClicked(screw) {
            if (gameState !== 'playing' || screw.state !== 'board' || isScrewCovered(screw)) return;
            
            if (isPlayerOperationDisabled()) return;

            const activeTrayScrews = tray.filter(s => !s.isMatched);
            
            if (activeTrayScrews.length >= MAX_TRAY_SLOTS) {
                triggerGameOver("空きストックがなくなった！");
                return;
            }

            playPopSE();
            
            screw.state = 'flying';
            tray.push(screw);
            visualTray.push(screw);
            
            const nonMatched = tray.filter(s => !s.isMatched);
            nonMatched.sort((a, b) => a.color.localeCompare(b.color));
            
            let newVisual = [...visualTray];
            let writeIdx = 0;
            for (let i = 0; i < newVisual.length; i++) {
                if (!newVisual[i].isMatched) {
                    newVisual[i] = nonMatched[writeIdx++];
                }
            }
            visualTray = newVisual;
            tray = nonMatched.concat(tray.filter(s => s.isMatched));

            let matchColor = null;
            let matchScrews = [];
            for (let i = 0; i <= nonMatched.length - 3; i++) {
                if (nonMatched[i].color === nonMatched[i+1].color && nonMatched[i].color === nonMatched[i+2].color) {
                    matchColor = nonMatched[i].color;
                    matchScrews = [nonMatched[i], nonMatched[i+1], nonMatched[i+2]];
                    break;
                }
            }

            if (matchColor) {
                if (gameMode === 'score') {
                    score += 10;
                    updateUITexts();
                }

                matchScrews.forEach(s => s.isMatched = true);
                
                matchAnimations.push({
                    screws: matchScrews,
                    state: 'moving',
                    timer: 0
                });
            }
            
            updateTrayTargets();
            removeScrewFromPlates(screw.id);
        }

        function removeScrewFromPlates(screwId) {
            plates.forEach(p => {
                if (p.isFalling) return;
                const idx = p.screws.indexOf(screwId);
                if (idx !== -1) {
                    p.screws.splice(idx, 1);
                    
                    if (p.screws.length === 1) {
                        p.pivotId = p.screws[0];
                        const pivot = allScrews.find(s => s.id === p.pivotId);
                        if (pivot) {
                            p.pivotX = pivot.boardX;
                            p.pivotY = pivot.boardY;
                            const cx = p.x + p.w / 2;
                            const cy = p.y + p.h / 2;
                            p.relCx = cx - p.pivotX; 
                            p.relCy = cy - p.pivotY;
                            p.baseAngle = Math.atan2(p.relCy, p.relCx);
                            p.dist = Math.hypot(p.relCx, p.relCy);
                            p.angle = p.baseAngle; 
                            p.aVel = 0; 
                            p.rotation = 0; 
                        }
                    } else if (p.screws.length === 0) {
                        p.isFalling = true;
                        p.vy = 0;
                        if (p.pivotId !== undefined) {
                            const currentRelCx = Math.cos(p.angle) * p.dist;
                            const currentRelCy = Math.sin(p.angle) * p.dist;
                            p.fallX = p.pivotX + currentRelCx;
                            p.fallY = p.pivotY + currentRelCy;
                            p.vr = p.aVel + (Math.random() - 0.5) * 0.05;
                        } else {
                            p.fallX = p.x + p.w/2;
                            p.fallY = p.y + p.h/2;
                            p.rotation = 0;
                            p.vr = (Math.random() - 0.5) * 0.1;
                        }
                        
                        playDropSE();
                        if (gameMode === 'score') {
                            score += 100;
                            updateUITexts();
                        }
                    }
                }
            });
        }

        function checkLevelClear() {
            if (matchAnimations.length > 0) return;

            let allPlatesCleared = true;
            if (plates.length === 0) {
                allPlatesCleared = false;
            } else {
                for (let i = 0; i < plates.length; i++) {
                    const p = plates[i];
                    if (!p.isFalling) {
                        allPlatesCleared = false;
                        break;
                    }
                    const plateTopY = virtualCenterY + p.fallY + p.yOffset - Math.max(p.w, p.h);
                    if (plateTopY < canvas.height) {
                        allPlatesCleared = false;
                        break;
                    }
                }
            }

            if (allPlatesCleared) {
                gameState = 'level_transition';
                currentLevel++;
                
                if (gameMode === 'endless' && currentLevel % 10 === 0) {
                    stopBGM(true);
                    generatedMelody = generateRandomMelody();
                    setTimeout(() => { if(isBgmEnabled) playCuteBGM(); }, 1000);
                }

                setTimeout(() => {
                    updateUITexts();
                    generateLevel(currentLevel);
                    resize();
                    gameState = 'playing';
                }, 500);
            }
        }

        function reportScore() {
            window.parent.postMessage({
                type: 'gameOver',
                score: score
            }, '*');
        }

        function drawRoundedRect(ctx, x, y, width, height, radius) {
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + width - radius, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
            ctx.lineTo(x + width, y + height - radius);
            ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
            ctx.lineTo(x + radius, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.closePath();
        }

        // 板が回転した際、自身より手前にあるネジにぶつからないかチェックする
        function checkPlateScrewCollision(p, nextAngle) {
            if (p.zLayer === undefined) return false;
            
            const cos = Math.cos(nextAngle - p.baseAngle);
            const sin = Math.sin(nextAngle - p.baseAngle);
            
            for (let i = 0; i < allScrews.length; i++) {
                const s = allScrews[i];
                if (s.state !== 'board') continue;
                
                if (s.highestPlateIdx >= p.zLayer && !p.screws.includes(s.id) && p.pivotId !== s.id) {
                    const dx = s.boardX - p.pivotX;
                    const dy = s.boardY - p.pivotY;
                    const rdx = dx * cos + dy * sin;
                    const rdy = -dx * sin + dy * cos;
                    
                    const localX = rdx - (p.x - p.pivotX);
                    const localY = rdy - (p.y - p.pivotY);
                    
                    // 板の矩形内にネジがあるか
                    if (localX >= -16 && localX <= p.w + 16 &&
                        localY >= -16 && localY <= p.h + 16) {
                        return true; 
                    }
                }
            }
            return false;
        }

        function updateLogic(dt) {
            if (gameState === 'playing' || gameState === 'level_transition') {
                if (gameState === 'playing' && gameMode === 'score') {
                    gameTime -= dt;
                    if (gameTime <= 0) {
                        gameTime = 0;
                        triggerGameOver("タイムアップ！");
                    }
                    updateUITexts();
                }

                plates.forEach(p => {
                    if (p.isFalling) {
                        p.vy += 0.8;
                        p.yOffset += p.vy;
                        p.rotation += p.vr;
                    } else if (p.screws.length === 1 && p.pivotId !== undefined) {
                        const currentRelCx = Math.cos(p.angle) * p.dist;
                        const g = 0.6;
                        const aAcc = (g / p.dist) * currentRelCx * 0.06;
                        p.aVel += aAcc;
                        p.aVel *= 0.96; 
                        
                        const nextAngle = p.angle + p.aVel;
                        // ネジとの衝突判定
                        if (checkPlateScrewCollision(p, nextAngle)) {
                            p.aVel = -p.aVel * 0.3; // 跳ね返る
                        } else {
                            p.angle = nextAngle;
                            p.rotation = p.angle - p.baseAngle;
                        }
                    }
                });

                allScrews.forEach(s => {
                    // rearranging ステートは削除し、即座に移動させるのでチェックしない
                    if (s.state === 'flying' || s.state === 'tray' || s.isMatched) {
                        const dx = s.targetX - s.x;
                        const dy = s.targetY - s.y;
                        const dist = Math.hypot(dx, dy);
                        
                        if (dist > 1.5) {
                            s.x += dx * 0.12;
                            s.y += dy * 0.12;
                            if (s.state === 'flying' && dist < 10 && !s.isMatched) s.state = 'tray'; 
                        } else {
                            s.x = s.targetX;
                            s.y = s.targetY;
                        }
                    }
                    if (s.state === 'popping') {
                        s.scale -= 0.1;
                        if (s.scale <= 0) s.state = 'done';
                    }
                });

                matchAnimations.forEach(ma => {
                    if (ma.state === 'moving') {
                        let allReached = true;
                        ma.screws.forEach(s => {
                            const dx = s.targetX - s.x;
                            const dy = s.targetY - s.y;
                            if (Math.hypot(dx, dy) > 1.5) {
                                allReached = false;
                            }
                        });
                        if (allReached) {
                            ma.state = 'flashing';
                            ma.timer = 24; 
                            playSparkleSE();
                            ma.screws.forEach(s => { s.x = s.targetX; s.y = s.targetY; });
                        }
                    } else if (ma.state === 'flashing') {
                        ma.timer--;
                        ma.screws.forEach(s => {
                            s.flash = true;
                            s.flashAlpha = (Math.floor(ma.timer / 4) % 2 === 0) ? 0.9 : 0.2;
                        });
                        if (ma.timer <= 0) {
                            ma.state = 'popping';
                            ma.screws.forEach(s => {
                                s.state = 'popping';
                                s.flash = false;
                            });
                        }
                    } else if (ma.state === 'popping') {
                        let allPopped = true;
                        ma.screws.forEach(s => {
                            if (s.state !== 'done') allPopped = false;
                        });
                        if (allPopped) {
                            // アニメーションさせず即座に完了(瞬間移動)させる
                            ma.state = 'done';
                            tray = tray.filter(s => !ma.screws.includes(s));
                            visualTray = visualTray.filter(s => !ma.screws.includes(s));
                            
                            updateTrayTargets();
                            visualTray.forEach(s => {
                                if (s.state === 'tray' || s.state === 'flying') {
                                    s.x = s.targetX;
                                    s.y = s.targetY;
                                }
                            });
                        }
                    }
                });
                matchAnimations = matchAnimations.filter(ma => ma.state !== 'done');
                
                allScrews = allScrews.filter(s => s.state !== 'done');

                if (gameState === 'playing') {
                    checkLevelClear();
                    
                    const activeScrews = tray.filter(s => !s.isMatched);
                    if (activeScrews.length >= MAX_TRAY_SLOTS && matchAnimations.length === 0) {
                        const flyingScrews = allScrews.filter(s => s.state === 'flying');
                        if (flyingScrews.length === 0) {
                            triggerGameOver("空きストックがなくなった！");
                        }
                    }
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (bgImg.complete) {
                const scale = Math.max(canvas.width / bgImg.width, canvas.height / bgImg.height);
                const w = bgImg.width * scale;
                const h = bgImg.height * scale;
                ctx.drawImage(bgImg, (canvas.width - w)/2, (canvas.height - h)/2, w, h);
            }

            const slotW = 42;
            const spacing = 6;
            const totalW = MAX_TRAY_SLOTS * slotW + (MAX_TRAY_SLOTS - 1) * spacing;
            const startX = canvas.width / 2 - totalW / 2;
            const trayY = getTraySlotY() - 32;
            const trayH = 64;
            
            ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
            drawRoundedRect(ctx, startX - 15, trayY - 10, totalW + 30, trayH + 20, 15);
            ctx.fill();
            
            for(let i=0; i<MAX_TRAY_SLOTS; i++) {
                const cx = startX + slotW/2 + i * (slotW + spacing);
                const cy = trayY + trayH/2;
                ctx.beginPath();
                ctx.arc(cx, cy, 21, 0, Math.PI*2);
                ctx.fillStyle = 'rgba(0,0,0,0.4)';
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = 'rgba(255,255,255,0.15)';
                ctx.stroke();
            }

            const disableOp = isPlayerOperationDisabled();

            allScrews.forEach(s => {
                if (s.state === 'board' && s.highestPlateIdx === -1) drawScrew(s, disableOp);
            });

            const maxZ = Math.max(...plates.map(p => p.zLayer || 0), 0);
            for (let z = 0; z <= maxZ; z++) {
                plates.forEach(p => {
                    if (!p.isFalling && p.zLayer === z) drawPlate(p);
                });
                allScrews.forEach(s => {
                    if (s.state === 'board' && s.highestPlateIdx === z) drawScrew(s, disableOp);
                });
            }

            plates.forEach(p => {
                if (p.isFalling) drawPlate(p);
            });

            allScrews.forEach(s => {
                if (s.state !== 'board' && s.state !== 'done') drawScrew(s, false);
            });
        }

        function drawPlate(p) {
            ctx.save();
            
            if (p.isFalling) {
                ctx.translate(virtualCenterX + p.fallX, virtualCenterY + p.fallY + p.yOffset);
                ctx.rotate(p.rotation);
                ctx.translate(-p.w/2, -p.h/2);
            } else if (p.screws.length === 1 && p.pivotId !== undefined) {
                ctx.translate(virtualCenterX + p.pivotX, virtualCenterY + p.pivotY);
                ctx.rotate(p.rotation);
                ctx.translate(p.x - p.pivotX, p.y - p.pivotY);
            } else {
                ctx.translate(virtualCenterX + p.x, virtualCenterY + p.y);
            }
            
            if (!p.isFalling) {
                ctx.shadowColor = 'rgba(0,0,0,0.6)';
                ctx.shadowBlur = 12;
                ctx.shadowOffsetY = 8;
            }
            
            ctx.fillStyle = p.color;
            drawRoundedRect(ctx, 0, 0, p.w, p.h, 22);
            ctx.fill();
            
            ctx.shadowColor = 'transparent';
            ctx.lineWidth = 4;
            ctx.strokeStyle = 'rgba(255,255,255,0.8)';
            ctx.stroke();
            
            ctx.restore();
        }

        function drawScrew(s, forceDark = false) {
            ctx.save();
            ctx.translate(s.x, s.y);
            ctx.scale(s.scale, s.scale);
            
            const isCovered = isScrewCovered(s) || forceDark;

            ctx.beginPath();
            ctx.arc(0, 0, 16, 0, Math.PI * 2);
            ctx.fillStyle = s.color;
            ctx.fill();
            if (isCovered) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
                ctx.fill();
            }
            
            const grad = ctx.createLinearGradient(-10, -10, 10, 10);
            grad.addColorStop(0, 'rgba(255,255,255,0.3)');
            grad.addColorStop(1, 'rgba(0,0,0,0.3)');
            ctx.fillStyle = grad;
            ctx.fill();

            ctx.lineWidth = 3;
            ctx.strokeStyle = 'rgba(0,0,0,0.4)';
            ctx.stroke();
            
            ctx.lineWidth = 4;
            ctx.strokeStyle = 'rgba(255,255,255,0.5)';
            if (isCovered) ctx.strokeStyle = 'rgba(0,0,0,0.5)';
            ctx.beginPath();
            ctx.moveTo(-7, -7); ctx.lineTo(7, 7);
            ctx.moveTo(7, -7); ctx.lineTo(-7, 7);
            ctx.stroke();

            if (s.flash) {
                ctx.beginPath();
                ctx.arc(0, 0, 16, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${s.flashAlpha})`;
                ctx.fill();
            }
            
            ctx.restore();
        }

        function loop(timestamp) {
            const dt = (timestamp - lastTimestamp) / 1000;
            lastTimestamp = timestamp;
            if (dt < 0.2) {
                updateLogic(dt);
            }
            draw();
            if (gameState !== 'start' && gameState !== 'lose') {
                requestAnimationFrame(loop);
            }
        }

        canvas.addEventListener('pointerdown', (e) => {
            if (gameState === 'start') {
                initAudio();
            }
            if (gameState !== 'playing') return;
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            // 複数のネジに触れた場合、Zレイヤーが一番高い（手前にある）ものを優先して選択する
            let hitScrews = [];
            for (let i = 0; i < allScrews.length; i++) {
                const s = allScrews[i];
                if (s.state === 'board') {
                    const dx = x - s.x;
                    const dy = y - s.y;
                    if (dx * dx + dy * dy <= 24 * 24) { 
                        hitScrews.push(s);
                    }
                }
            }
            
            if (hitScrews.length > 0) {
                hitScrews.sort((a, b) => b.highestPlateIdx - a.highestPlateIdx);
                onScrewClicked(hitScrews[0]);
            }
        });
    </script>
</body>
</html>
